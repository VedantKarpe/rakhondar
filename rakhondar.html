<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rakhondar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Yatra+One&display=swap">
<style>
/* Layout: one full-bleed isometric night canvas; HUD floats at the edges; story cards sit over the village */
:root {
  --night: #070a16;
  --ink: #ece4cf;
  --muted: #9aa0b4;
  --laterite: #b8562f;
  --lamp: #f2b441;
  --spirit: #9fe8d6;
  --card: rgba(9, 12, 26, 0.88);
  --display: "Yatra One", "Mukta", Georgia, serif;
  --body: "Mukta", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }
#wrap { position: relative; height: 100%; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.hud {
  position: absolute; top: 12px;
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; gap: 12px; pointer-events: none;
}
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat.right { align-items: flex-end; }
.lbl { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.pips { display: flex; gap: 6px; }
.pip { width: 12px; height: 16px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: #2a2d3a; }
.pip.on.courage { background: var(--lamp); box-shadow: 0 0 10px var(--lamp); }
.pip.spirit { border-radius: 50%; height: 12px; }
.pip.on.spirit { background: var(--spirit); box-shadow: 0 0 10px var(--spirit); }

#objective {
  position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
  font-size: 14px; color: var(--muted); text-align: center; pointer-events: none;
  max-width: calc(100% - 32px);
}
#whisper {
  position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%);
  max-width: min(32rem, calc(100% - 32px)); text-align: center;
  font-family: var(--display); font-size: 20px; color: var(--spirit);
  text-shadow: 0 0 14px rgba(159, 232, 214, 0.55);
  opacity: 0; transition: opacity 0.5s; pointer-events: none;
}
#whisper.show { opacity: 1; }
/* the voice in the dark speaks in a different colour from the Rakhondar */
#whisper.voice { color: #c9a8ff; font-style: italic; text-shadow: 0 0 14px rgba(170, 120, 255, 0.6); }
.chapters { display: grid; gap: 8px; }
.chapter {
  display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 4px 12px; text-align: left;
  font: 15px var(--body); color: var(--ink); background: rgba(236, 228, 207, 0.04); cursor: pointer;
  border: 1px solid rgba(236, 228, 207, 0.18); border-radius: 6px; padding: 10px 14px;
}
.chapter:hover { border-color: rgba(242, 180, 65, 0.6); }
.chapter .num { font-family: var(--display); font-size: 20px; color: var(--lamp); }
.chapter .where { grid-column: 2; font-size: 13px; color: var(--muted); }
.chapter .done { color: var(--spirit); font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
.field input {
  font: 16px var(--body); color: var(--ink); background: rgba(236, 228, 207, 0.06);
  border: 1px solid rgba(236, 228, 207, 0.3); border-radius: 6px; padding: 9px 12px; max-width: 16rem;
}
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
#rideBtn {
  position: absolute; bottom: 20px; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 190px);
  font: 600 15px var(--body); color: var(--night); background: var(--lamp);
  border: 0; border-radius: 999px; padding: 12px 18px; cursor: pointer;
}
#rideBtn kbd { font: inherit; font-weight: 400; opacity: 0.7; margin-left: 4px; }
#callBtn {
  position: absolute; bottom: 20px; right: max(16px, env(safe-area-inset-right, 0px));
  font: 600 15px var(--body); color: var(--night); background: var(--spirit);
  border: 0; border-radius: 999px; padding: 12px 18px; cursor: pointer;
  box-shadow: 0 0 22px rgba(159, 232, 214, 0.45);
}
#callBtn:disabled { background: #3a4150; color: var(--muted); box-shadow: none; cursor: default; }
#callBtn kbd { font: inherit; font-weight: 400; opacity: 0.7; margin-left: 4px; }
button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }

.screen {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at center, rgba(7, 10, 22, 0.4), rgba(7, 10, 22, 0.88));
}
.card {
  max-width: 34rem; background: var(--card); border: 1px solid rgba(242, 180, 65, 0.25);
  border-radius: 6px; padding: 28px; display: flex; flex-direction: column; gap: 14px;
  max-height: 100%; overflow-y: auto;
}
.eyebrow { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lamp); }
.card h1 { font-family: var(--display); font-weight: 400; font-size: 46px; line-height: 1; margin: 0; text-wrap: balance; }
.card h1 small { display: block; font-size: 22px; color: var(--spirit); margin-top: 8px; }
.card p { margin: 0; font-size: 16px; line-height: 1.55; color: #d6cfbd; }
.controls { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; color: var(--muted); }
.controls b { color: var(--ink); font-weight: 600; }
.start {
  align-self: flex-start; font: 700 16px var(--body); color: var(--night); background: var(--lamp);
  border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer;
}
.sound {
  pointer-events: auto; font: 600 12px var(--body); color: var(--muted); background: rgba(9, 12, 26, 0.5);
  border: 1px solid rgba(236, 228, 207, 0.25); border-radius: 999px; padding: 4px 11px; cursor: pointer; margin-top: 4px;
}
.pts { font: 700 16px var(--body); color: var(--lamp); }
.today { display: grid; gap: 6px; padding: 12px 14px; border-radius: 6px; background: rgba(242, 180, 65, 0.08); border: 1px solid rgba(242, 180, 65, 0.3); }
.today b { color: var(--lamp); }
.badge { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--night); background: var(--lamp); border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
.board { font-size: 13px; color: var(--muted); display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; }
.turn { display: flex; gap: 6px; pointer-events: auto; }
.credit {
  position: absolute; bottom: 8px; left: max(16px, env(safe-area-inset-left, 0px)); max-width: 55%;
  font-size: 11px; color: var(--muted); opacity: 0.8; pointer-events: none;
}
.oil { width: 96px; height: 6px; border-radius: 3px; background: #2a2d3a; overflow: hidden; }
.oil span { display: block; height: 100%; width: 100%; background: var(--lamp); transition: width 0.15s; }
.talk {
  position: absolute; left: 0; right: 0; bottom: 76px; display: flex; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.talk-card {
  max-width: 30rem; width: 100%; background: var(--card); border: 1px solid rgba(159, 232, 214, 0.3);
  border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;
}
.talk-card p { margin: 0; font-size: 16px; line-height: 1.5; color: #e2dbc6; }
.talk-card .hint { font-size: 13px; color: var(--spirit); }
.talk-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.ghost {
  font: 600 15px var(--body); color: var(--ink); background: transparent; cursor: pointer;
  border: 1px solid rgba(236, 228, 207, 0.4); border-radius: 999px; padding: 11px 20px;
}
.talk kbd, .start kbd { font: inherit; font-weight: 400; opacity: 0.6; margin-left: 4px; }
.summary { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.summary b { color: var(--ink); font-weight: 600; text-align: right; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 520px) {
  .card { padding: 20px; }
  .card h1 { font-size: 36px; }
  #whisper { font-size: 17px; bottom: 150px; }   /* clear of the mini map */
}
/* the mini map: the whole village, turned the same way as the view */
#miniWrap {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 28px;
  display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
}
#mini {
  width: 192px; height: 96px; border-radius: 6px; cursor: pointer; touch-action: manipulation;
  background: rgba(9, 12, 26, 0.78); border: 1px solid rgba(236, 228, 207, 0.25);
}
#miniWrap .sound { margin-top: 0; }
.goa { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.goa svg { width: 100%; max-height: 52vh; }
.goa svg text { font: 600 13px var(--body); fill: var(--muted); }
.goa svg .vil { cursor: pointer; }
.goa svg .vil text { fill: var(--ink); font-size: 12px; }
.taluka-list { display: grid; gap: 6px; font-size: 14px; }
.taluka-list > div { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.taluka-list b { min-width: 7.5rem; color: var(--ink); }
.taluka-list .none { color: var(--muted); font-size: 13px; }
.go { font: 600 13px var(--body); color: var(--night); background: var(--lamp); border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.go[disabled] { background: var(--spirit); cursor: default; }
@media (max-width: 520px) { #mini { width: 136px; height: 68px; } #miniWrap { bottom: 72px; } }
@media (prefers-reduced-motion: reduce) { #whisper { transition: none; } }
</style>

<div id="wrap">
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="stat"><span class="lbl">Courage</span><div class="pips" id="hearts"></div><span class="lbl">Lamp oil</span><div class="oil"><span id="oilFill"></span></div></div>
    <div class="stat right"><span class="lbl">Rakhondar calls</span><div class="pips" id="charges"></div><span class="lbl">Points</span><b class="pts" id="points">0</b><button class="sound" id="soundBtn" type="button">Sound on <kbd>M</kbd></button><div class="turn"><button class="sound" id="turnL" type="button" aria-label="Turn the view left">⟲</button><button class="sound" id="turnR" type="button" aria-label="Turn the view right">⟳</button></div></div>
  </div>
  <div id="objective"></div>
  <div id="whisper" aria-live="polite"></div>
  <div class="credit" id="credit"></div>
  <div id="miniWrap"><canvas id="mini" width="192" height="96" aria-label="Mini map of the village. Opens the map of Goa." role="button" tabindex="0"></canvas><button class="sound" id="goaBtn" type="button">Goa map <kbd>G</kbd></button></div>
  <button id="callBtn" type="button">Call Rakhondar <kbd>Space</kbd></button>
  <button id="rideBtn" type="button" hidden>Ride <kbd>B</kbd></button>
  <div class="talk" id="talk" hidden>
    <div class="talk-card">
      <span class="eyebrow" id="talkWho"></span>
      <p id="talkLine"></p>
      <p class="hint" id="talkHint"></p>
      <div class="talk-actions">
        <button class="start" id="btnTrust" type="button">Walk with them <kbd>E</kbd></button>
        <button class="ghost" id="btnBanish" type="button">Banish the demon <kbd>Q</kbd></button>
      </div>
    </div>
  </div>
  <div class="screen" id="screen">
    <div class="card" id="card"></div>
  </div>
</div>

      if (at(x, y) === WATER) { if (!best || k < best.k) best = { d, k }; break; }
    }
    if (best) {
      const s = [fx + best.d[0] * Math.max(0, best.k - 1), fy + best.d[1] * Math.max(0, best.k - 1)];
      let len = 1;
      while (len < 5 && at(s[0] + best.d[0] * len, s[1] + best.d[1] * len) === WATER) len++;
      jetty = { s, d: best.d, len };
    }
  }
  // a ferry point off the edge of the map: the road that leads down to it ends at the map edge
  let edge = null;
  if (A.ferry && !jetty && (A.ferry[0] < 0 || A.ferry[1] < 0 || A.ferry[0] >= W || A.ferry[1] >= H)) {
    let bd = 1e9;
    for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) {
      if (map[y * W + x] !== ROAD || (x > 3 && y > 3 && x < W - 4 && y < H - 4)) continue;
      const d = hyp(x - A.ferry[0], y - A.ferry[1]);
      if (d < bd) { bd = d; edge = [x, y]; }
    }
  }
  // the bus stop: a stretch of main road with room for the shelter beside it, away from the other landmarks
  let bus = null;
  const roads = [];
  for (let y = 3; y < H - 3; y++) for (let x = 2; x < W - 6; x++) if (map[y * W + x] === ROAD) roads.push([x, y]);
  roads.sort(() => rand() - 0.5);
  for (const [x, y] of roads) {
    let ok = true;
    for (let yy = y - 2; yy <= y - 1 && ok; yy++) for (let xx = x + 1; xx <= x + 3; xx++) if (![GR, PAD, LANE].includes(at(xx, yy))) { ok = false; break; }
    const farFrom = p => !p || hyp(x - p[0], y - p[1]) > 12;
    if (ok && farFrom(A.ferry) && farFrom([35.5 + OFF.t[0], 5 + OFF.t[1]]) && farFrom([35 + OFF.c[0], 26 + OFF.c[1]])) { bus = [x, y]; break; }
  }
  if (!bus && roads.length) bus = roads[0];
  // start somewhere on a lane, a fair walk from every landmark
  const lanesNow = [];
  const wild = (x, y) => { for (let yy = y - 2; yy <= y + 2; yy++) for (let xx = x - 2; xx <= x + 2; xx++) if ([WATER, MANG].includes(at(xx, yy))) return true; return false; };
  for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) if (map[y * W + x] === LANE && !wild(x, y)) lanesNow.push([x, y]);
  const sites = [[35.5 + OFF.t[0], 5 + OFF.t[1]], [35 + OFF.c[0], 26 + OFF.c[1]], A.ferry, bus].filter(Boolean);
  const score = ([x, y]) => Math.min(...sites.map(p => hyp(x - p[0], y - p[1])));
  lanesNow.sort((a, b) => score(b) - score(a));
  const pickFrom = lanesNow.slice(0, Math.max(1, Math.floor(lanesNow.length * 0.15)));
  let st = pickFrom[Math.floor(rand() * pickFrom.length)] || [Math.floor(W / 2), Math.floor(H / 2)];
  // a chapter that begins off the ferry starts on the nearest lane to it
  const landing = edge || (jetty && [jetty.s[0] - jetty.d[0], jetty.s[1] - jetty.d[1]]);
  if (CH.arrive === 'ferry' && landing) {
    const near = lanesNow.map(p => [p, hyp(p[0] - landing[0], p[1] - landing[1])]).filter(([, d]) => d >= 4).sort((a, b) => a[1] - b[1]);
    if (near.length) st = near[0][0];
  }
  START = { x: st[0], y: st[1] };
  if (V.names.temple) PLACE_NAMES.temple = 'the ' + V.names.temple.replace(/^Shree /, '');
  if (V.names.ferry) PLACE_NAMES.ferry = 'the ' + V.names.ferry.replace(/ Ferry$/, '') + ' ferry';
  return { jetty, bus, edge, connect: true };
}

function gen(seed) {
  rand = rng(seed);
  map = new Uint8Array(W * H).fill(GR);
  treeKind = new Uint8Array(W * H);
  houses = []; lights = []; props = []; kids = []; walls = new Set();
  OFF = { t: [0, 0], c: [0, 0], s: [0, 0] };
  Object.assign(PLACE_NAMES, PLACE_DEFAULTS);
  const set = (x, y, t) => { if (x >= 0 && y >= 0 && x < W && y < H) map[y * W + x] = t; };
  const fill = (x0, y0, x1, y1, t) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, t); };
  const noCarve = new Uint8Array(W * H);
  const block = (x0, y0, x1, y1) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (x >= 0 && y >= 0 && x < W && y < H) noCarve[y * W + x] = 1; };
  const noise = valueNoise(7);
  const L = MODE === 'real' ? layoutReal(VILLAGE, noCarve) : layoutRandom(noCarve, block, noise);
  if (L.connect && CH.names) Object.assign(PLACE_NAMES, CH.names);
  if (L.bus) OFF.s = [L.bus[0] - 51, L.bus[1] - RY];
  const [tx, ty] = OFF.t, [cx, cy] = OFF.c, [bx, by] = OFF.s;

  // temple grounds, chapel square with its cross and the pyre, the jetty and the bus shelter
  fill(30 + tx, 1 + ty, 41 + tx, 9 + ty, COURT);
  fill(33 + tx, 2 + ty, 37 + tx, 7 + ty, TEMPLE);
  set(31 + tx, 7 + ty, TEMPLE);
  fill(29 + cx, 21 + cy, 40 + cx, 30 + cy, PLAZA);
  fill(33 + cx, 22 + cy, 36 + cx, 25 + cy, CHAPEL);
  set(34 + cx, 28 + cy, PROP); props.push({ kind: 'bigcross', x: 34 + cx, y: 28 + cy });
  PYRE = { x: 31.5 + cx, y: 28.5 + cy };
  TEMPLE_GATE = { x: 35.5 + tx, y: 8.8 + ty };
  if (CH.finale === 'boss') for (const [a, sh] of [[0.6, '#3f7fbf'], [2.4, '#e0a33a'], [4.2, '#5aa05a']]) {
    const vx = PYRE.x + Math.cos(a) * 2.2, vy = PYRE.y + Math.sin(a) * 1.8;
    kids.push({ x: vx, y: vy, shirt: sh, face: Math.cos(a) > 0 ? -1 : 1, ph: rand() * 6, torch: true });
    lights.push({ kind: 'torch', x: vx, y: vy, r: 1.8, lift: 10, color: '255,150,60' });
  }
  let ferryExit = null;
  if (L.jetty) {
    const { s, d, len } = L.jetty, p = [Math.abs(d[1]), Math.abs(d[0])];
    for (let i = 0; i < len; i++) for (const q of [0, 1]) set(s[0] + d[0] * i + p[0] * q, s[1] + d[1] * i + p[1] * q, JETTY);
    const e = [s[0] + d[0] * (len - 1), s[1] + d[1] * (len - 1)];
    ferryExit = { kind: 'ferry', x: e[0] + 0.5 + p[0] * 0.5, y: e[1] + 0.5 + p[1] * 0.5, tx: e[0], ty: e[1], dir: d, r: 1.7, need: 10, wait: 0, told: false,
      lamp: [e[0] + 0.5 - d[0] * 0.8 - p[0] * 0.2, e[1] + 0.5 - d[1] * 0.8 - p[1] * 0.2] };
    if (L.connect) carvePath(nearestLane(s[0] - d[0], s[1] - d[1]), [s[0] - d[0], s[1] - d[1]], noCarve, noise);
  }
  if (L.edge) {
    const [ex, ey] = L.edge;
    ferryExit = { kind: 'ferry', edge: true, x: ex + 0.5, y: ey + 0.5, tx: ex, ty: ey, r: 1.5, need: 0, wait: 0, told: false, lamp: [ex + 1.2, ey + 0.3] };
  }
  if (L.bus) fill(52 + bx, 47 + by, 54 + bx, 48 + by, SHELTER);
  if (L.connect) {
    carvePath(nearestLane(35 + tx, 10 + ty, true), [35 + tx, 10 + ty], noCarve, noise);
    carvePath(nearestLane(34 + cx, 31 + cy, true), [34 + cx, 31 + cy], noCarve, noise);
  }

  // houses: Indo-Portuguese, each near a lane, front porch facing +y; real footprints first
  const walls6 = ['#f2c230', '#2f6fd0', '#e8e0cc', '#2fa08a', '#e0763a', '#4a8fe0', '#d0344a', '#f4d84a'];
  const nearLane = (x0, y0, x1, y1, r) => { for (let y = y0 - r; y <= y1 + r; y++) for (let x = x0 - r; x <= x1 + r; x++) if (at(x, y) === LANE) return true; return false; };
  const known = L.connect ? VILLAGE.houses.slice() : [];
  // in a real village, houses also stand on the paddy's edge along a lane, as they do in Goa
  const buildable = t => t === GR || (L.connect && t === PAD);
  for (let tries = 0; tries < (L.connect ? 4000 : 500) && houses.length < (L.connect ? Math.max(50, Math.min(140, VILLAGE.houses.length)) : 48); tries++) {
    let x, y, w, h = 3;
    if (known.length) [x, y, w] = known.shift();
    else { w = 3 + Math.floor(rand() * 2); x = 2 + Math.floor(rand() * (W - (L.connect ? 7 : 16))); y = 2 + Math.floor(rand() * (H - (L.connect ? 6 : 12))); }
    let ok = true;
    for (let yy = y - 1; yy <= y + h && ok; yy++) for (let xx = x - 1; xx <= x + w; xx++) if (!buildable(at(xx, yy))) { ok = false; break; }
    if (!ok || !nearLane(x, y, x + w - 1, y + h - 1, 3)) continue;
    if (hyp(x - START.x, y - START.y) < 3) continue;
    fill(x, y, x + w - 1, y + h - 1, HOUSE);
    const hs = { x, y, w, h, wall: walls6[Math.floor(rand() * walls6.length)], faith: rand() < 0.5 ? 'tulsi' : 'cross', kandil: rand() < 0.45, tavern: false };
    houses.push(hs);
    const yx = x + w, yy = y + h;
    if (at(yx, yy) === GR) { set(yx, yy, PROP); props.push({ kind: hs.faith, x: yx, y: yy }); }
  }
  const tav = houses.find(h => h.w === 4);
  if (tav) { tav.tavern = true; tav.wall = '#2f6e6a'; }

  const laneAdj = (x, y) => D4.some(([dx, dy]) => at(x + dx, y + dy) === LANE);
  const roadAdj = (x, y) => D4.some(([dx, dy]) => at(x + dx, y + dy) === ROAD);
  const freeGR = [];
  for (let y = 2; y < H - 2; y++) for (let x = 2; x < W - 2; x++) if (map[y * W + x] === GR) freeGR.push([x, y]);
  const pick = (n, ok, spacing) => {
    const out = [];
    for (let tries = 0; tries < 2000 && out.length < n && freeGR.length; tries++) {
      const [x, y] = freeGR[Math.floor(rand() * freeGR.length)];
      if (map[y * W + x] !== GR || !ok(x, y) || out.some(o => hyp(o[0] - x, o[1] - y) < spacing)) continue;
      out.push([x, y]);
    }
    return out;
  };
  // the Rakhondar's own devli: a little open shrine facing a lane
  let devli = null;
  for (let tries = 0; tries < 6000 && !devli; tries++) {
    const x = 3 + Math.floor(rand() * (W - 8)), y = 3 + Math.floor(rand() * (H - 8)), k = tries < 3000 ? 1 : 0.6;   // settle for closer if the village is cramped
    if (hyp(x - START.x, y - START.y) < 16 * k || hyp(x - TEMPLE_GATE.x, y - TEMPLE_GATE.y) < 10 * k || hyp(x - PYRE.x, y - PYRE.y) < 10 * k) continue;
    let ok = true;
    for (let yy = y - 1; yy <= y + 2 && ok; yy++) for (let xx = x - 1; xx <= x + 2; xx++) if (!buildable(at(xx, yy))) { ok = false; break; }
    if (ok && [x, x + 1].some(xx => laneAdj(xx, y + 2) || (L.connect && roadAdj(xx, y + 2)))) devli = { x, y };
  }
  if (devli) {
    fill(devli.x, devli.y, devli.x + 1, devli.y + 1, PROP);
    fill(devli.x, devli.y + 2, devli.x + 1, devli.y + 2, MUD);
    props.push({ kind: 'devli', x: devli.x, y: devli.y });
    lights.push({ kind: 'devli', x: devli.x + 1, y: devli.y + 1.6, r: 3.2, lift: 10, color: '159,232,214' });
  }
  // the night's festival: Narkasur effigies, Bonderam flags or Zagor lamp stands, with children around them
  if (CH.fest) for (const [x, y] of pick(3, (x, y) => laneAdj(x, y) && hyp(x - START.x, y - START.y) > 6, 12)) {
    set(x, y, PROP); props.push({ kind: CH.fest, x, y, flag: ['#d8553a', '#e0b13a', '#3f7fbf', '#5aa05a'][Math.floor(rand() * 4)] });
    lights.push({ kind: CH.fest === 'effigy' ? 'effigy' : 'fest', x: x + 0.5, y: y + 0.5, r: 2.8, color: CH.fest === 'samai' ? '255,200,110' : '255,190,90' });
    let n = 0;
    for (const [dx, dy] of [[-1, 0], [0, -1], [1, 0], [0, 1], [-1, 1]]) {
      if (n >= 2) break;
      const kx = x + dx, ky = y + dy;
      if (at(kx, ky) === GR) { set(kx, ky, MUD); kids.push({ x: kx + 0.5, y: ky + 0.5, shirt: ['#3f7fbf', '#e0a33a', '#5aa05a'][n], face: -dx || 1, ph: rand() * 6 }); n++; }
    }
  }
  // billboards by the roads and lanes, two tiles wide, facing the street
  const nearStreet = (x, y) => [ROAD, LANE].includes(at(x, y + 1)) || [ROAD, LANE].includes(at(x + 1, y + 1));
  const ads = ADS.slice().sort(() => rand() - 0.5);
  for (const [x, y] of pick(5, (x, y) => at(x + 1, y) === GR && nearStreet(x, y) && hyp(x - START.x, y - START.y) > 4, 9)) {
    set(x, y, PROP); set(x + 1, y, PROP);
    props.push({ kind: 'billboard', x, y, ad: ads[props.filter(p => p.kind === 'billboard').length % ads.length] });
    lights.push({ kind: 'billboard', x: x + 1, y: y + 1.3, r: 1.6, lift: 20, color: '240,240,220' });
  }
  for (const [x, y] of pick(3, laneAdj, 10)) {
    set(x, y, PROP); props.push({ kind: 'khuris', x, y });
    lights.push({ kind: 'khuris', x: x + 0.5, y: y + 0.5, r: 2.2, color: '255,200,110' });
  }
  for (const [x, y] of pick(5, (x, y) => !laneAdj(x, y) && nearLane(x, y, x, y, 2), 9)) { set(x, y, PROP); props.push({ kind: 'well', x, y }); }
  for (const [x, y] of pick(3, laneAdj, 12)) { set(x, y, PROP); props.push({ kind: 'bike', x, y }); }
  const carCols = ['#e8e4dc', '#b8322a', '#2f4f7a', '#c9c9c9', '#3a6a4a'];
  for (const [x, y] of pick(7, (x, y) => (laneAdj(x, y) || roadAdj(x, y)) && at(x + 1, y) === GR && at(x - 1, y) === GR, 8)) {
    set(x, y, PROP); props.push({ kind: 'car', x, y, dir: rand() < 0.5 ? 1 : -1, col: carCols[Math.floor(rand() * carCols.length)] });
  }

  // laterite compound walls along the lanes, in runs with gaps
  const wn = valueNoise(4);
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    if (map[i] === GR && laneAdj(x, y) && wn[i] > 0.42 && hyp(x - START.x, y - START.y) > 2) { map[i] = WALL; if (rand() < 0.2) walls.add(i); }
  }
  // trees: coconut everywhere, mango and banana near houses, cashew on the open ground
  const nearHouse = (x, y) => { for (let yy = y - 2; yy <= y + 2; yy++) for (let xx = x - 2; xx <= x + 2; xx++) if (at(xx, yy) === HOUSE) return true; return false; };
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x;
    if (map[i] !== GR || laneAdj(x, y) || hyp(x - START.x, y - START.y) < 2) continue;
    const r = rand(), nh = nearHouse(x, y), south = !L.connect && y > RY + 1;
    let k = 0;
    if (r < (south ? 0.08 : 0.03)) k = 1;
    else if (r < (nh ? 0.06 : 0.04)) k = nh ? 4 : 3;
    else if (r < (nh ? 0.09 : 0.05)) k = 2;
    if (k) { map[i] = TREE; treeKind[i] = k; }
  }
  // a scatter of palms along the village edge and the far bank
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, edge = x === 0 || y === 0 || x === W - 1 || y === H - 1;
    const farBank = riverC && x > riverC(y) + 4 && map[i] === GR;
    if ((edge && map[i] === GR && rand() < 0.3) || (farBank && rand() < 0.18)) { map[i] = TREE; treeKind[i] = rand() < 0.75 ? 1 : 3; }
  }
  // the map edge stays walled in even where no palm grew
  for (let x = 0; x < W; x++) for (const y of [0, H - 1]) if (!solid(map[y * W + x])) map[y * W + x] = TREE, treeKind[y * W + x] = 1;
  for (let y = 0; y < H; y++) for (const x of [0, W - 1]) if (!solid(map[y * W + x])) map[y * W + x] = TREE, treeKind[y * W + x] = 1;

  // diyas on the lanes, waiting to be lit
  const laneTiles = [];
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) if (map[y * W + x] === LANE) laneTiles.push([x, y]);
  lanes = laneTiles;
  const diyas = [];
  for (let tries = 0; tries < 3000 && diyas.length < 15; tries++) {
    const [x, y] = laneTiles[Math.floor(rand() * laneTiles.length)];
    if (hyp(x - START.x, y - START.y) < 5 || diyas.some(d => hyp(d[0] - x, d[1] - y) < 7)) continue;
    diyas.push([x, y]);
    lights.push({ kind: 'diya', x: x + 0.5, y: y + 0.5, r: 2.9, safeR: 2.1, lit: false, spent: false, life: 0, color: '242,170,60' });
  }
  for (const h of houses) {
    if (h.kandil) lights.push({ kind: 'kandil', x: h.x + h.w / 2, y: h.y + h.h + 0.25, r: 1.9, lift: 6, hx: h.x + h.w / 2, hy: h.y + h.h - 0.05, color: ['255,120,60', '255,200,70', '240,80,110'][Math.floor(rand() * 3)] });
    if (h.tavern) lights.push({ kind: 'lamp', x: h.x + h.w + 0.3, y: h.y + h.h - 0.5, r: 2.3, color: '255,210,140' });
  }
  lights.push({ kind: 'temple', x: 35.5 + tx, y: 8.6 + ty, r: 5, lift: 14, color: '242,170,60' });
  lights.push({ kind: 'stambha', x: 31.5 + tx, y: 7.5 + ty, r: 3.6, lift: 40, color: '242,170,60' });
  lights.push({ kind: 'chapel', x: 35 + cx, y: 26.6 + cy, r: 3.3, lift: 8, color: '255,215,150' });
  lights.push({ kind: 'cross', x: 34.5 + cx, y: 28.9 + cy, r: 1.8, lift: 2, color: '255,200,110' });
  if (L.bus) lights.push({ kind: 'lamp', x: 51.6 + bx, y: RY - 0.4 + by, r: 2.7, color: '200,220,255' });
  if (ferryExit) lights.push({ kind: 'lamp', x: ferryExit.lamp[0], y: ferryExit.lamp[1], r: 2.6, color: '255,210,140' });

  exits = [
    { kind: 'temple', x: TEMPLE_GATE.x, y: TEMPLE_GATE.y, tx: 35 + tx, ty: 8 + ty, r: 1.3, need: 0, wait: 0, told: false },
    { kind: 'chapel', x: 35 + cx, y: 26.4 + cy, tx: 35 + cx, ty: 26 + cy, r: 1.1, need: 0, wait: 0, told: false }
  ];
  if (L.bus) {
    const [ux, uy] = L.bus, axis = at(ux + 1, uy) === ROAD || at(ux - 1, uy) === ROAD ? [1, 0] : [0, 1];
    exits.push({ kind: 'bus', x: ux + 0.5, y: uy + 0.9, tx: ux, ty: uy, axis, r: 2.2, need: 10, wait: 0, told: false });
  }
  if (ferryExit) exits.push(ferryExit);
  if (devli) exits.push({ kind: 'devli', x: devli.x + 1, y: devli.y + 2.4, tx: devli.x, ty: devli.y + 2, r: 1.1, need: 0, wait: 0, told: false });
  placeChapterThings(devli);

  // traffic on the roads and canoes on the water
  const roadTiles = [], waterT = [];
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) { const t = map[y * W + x]; if (t === ROAD) roadTiles.push([x, y]); if (t === WATER) waterT.push([x, y]); }
  cars0 = [];
  for (let i = 0; i < 3 && roadTiles.length; i++) {
    const [x, y] = roadTiles[Math.floor(rand() * roadTiles.length)];
    const d = D4.find(([dx, dy]) => at(x + dx, y + dy) === ROAD) || [1, 0];
    cars0.push({ x: x + 0.5, y: y + 0.5, dx: d[0], dy: d[1], col: carCols[i % carCols.length], tile: -1 });
  }
  boats0 = [];
  for (let i = 0; i < 2 && waterT.length; i++) {
    const [x, y] = waterT[Math.floor(rand() * waterT.length)];
    boats0.push({ x: x + 0.5, y: y + 0.5, dx: 0, dy: 1, tile: -1 });
  }

  waterTiles = waterT.map(([x, y]) => [x, y, rand()]);
  // how far each tile is from water, for the sound of the river
  distW.fill(-1);
  let qh = 0, qt = 0;
  for (const [x, y] of waterT) { distW[y * W + x] = 0; queue[qt++] = y * W + x; }
  while (qh < qt) {
    const c = queue[qh++], x = c % W, y = (c / W) | 0;
    for (const [dx, dy] of D4) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue; const n = ny * W + nx; if (distW[n] === -1) { distW[n] = distW[c] + 1; queue[qt++] = n; } }
  }
  fireflies = [];
  for (let tries = 0; tries < 4000 && fireflies.length < 90; tries++) {
    const x = 1 + Math.floor(rand() * (W - 2)), y = 1 + Math.floor(rand() * (H - 2)), t = map[y * W + x];
    if (t === PAD || t === MANG || (t === GR && D4.some(([dx, dy]) => at(x + dx, y + dy) === TREE))) fireflies.push({ x: x + rand(), y: y + rand(), ph: rand() * 6.28 });
  }

/* ---------- pathing ---------- */
function bfs(sx, sy, out = dist) {
  out.fill(-1);
  let h = 0, t = 0;
  const s = sy * W + sx;
  if (solid(map[s])) return;
  out[s] = 0; queue[t++] = s;
  while (h < t) {
    const c = queue[h++], cx = c % W, cy = (c / W) | 0;
    for (const [dx, dy] of D4) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const n = ny * W + nx;
      if (out[n] !== -1 || solid(map[n]) || map[n] === PIT) continue;   // nobody plans a route over an open well
      out[n] = out[c] + 1; queue[t++] = n;
    }
  }
}
// step toward whatever a distance field was built from: the next tile downhill, or straight at it once adjacent
function downhill(field, e, tx, ty) {
  if (field[ty * W + tx] <= 1) return null;
  let best = null, bd = 1e9;
  for (const [ax, ay] of D4) { const n = field[(ty + ay) * W + tx + ax]; if (n >= 0 && n < bd) { bd = n; best = [ax, ay]; } }
  return best ? [tx + best[0] + 0.5 - e.x, ty + best[1] + 0.5 - e.y] : null;
}
function blocked(x, y, r) {
  return solid(at(Math.floor(x - r), Math.floor(y - r))) || solid(at(Math.floor(x + r), Math.floor(y - r))) ||
         solid(at(Math.floor(x - r), Math.floor(y + r))) || solid(at(Math.floor(x + r), Math.floor(y + r)));
}
function moveEnt(e, dx, dy) {
  if (!blocked(e.x + dx, e.y, e.r)) e.x += dx;

}

function steer(e, mx, my, dt) {
  const x0 = e.x, y0 = e.y;
  moveEnt(e, mx, my);
  e.stuck = hyp(e.x - x0, e.y - y0) < hyp(mx, my) * 0.3 ? (e.stuck || 0) + dt : 0;
  if (e.stuck > 0.25) { e.x += (Math.floor(e.x) + 0.5 - e.x) * 0.3; e.y += (Math.floor(e.y) + 0.5 - e.y) * 0.3; }

const diyaStrength = l => Math.min(1, 0.35 + l.life / 6);

function wander(c, kind, speed, dt, straightBias) {
  const tx = Math.floor(c.x), ty = Math.floor(c.y), ti = ty * W + tx;
  if (ti !== c.tile && hyp(c.x - tx - 0.5, c.y - ty - 0.5) < 0.13) {
    c.tile = ti; c.x = tx + 0.5; c.y = ty + 0.5;
    const opts = D4.filter(([ax, ay]) => at(tx + ax, ty + ay) === kind && !(ax === -c.dx && ay === -c.dy));
    const straight = opts.find(([ax, ay]) => ax === c.dx && ay === c.dy);
    const next = straight && Math.random() < straightBias ? straight : opts[Math.floor(Math.random() * opts.length)];
    if (next) { c.dx = next[0]; c.dy = next[1]; } else { c.dx = -c.dx; c.dy = -c.dy; }
  }

function placeChapterThings(devli) {

  const spaced = (list, x, y, d) => list.every(o => hyp(o.x - x, o.y - y) >= d);
  const nearExit = (x, y, d) => exits.some(e => hyp(e.x - x, e.y - y) < d);

    for (const [x, y] of all) {

    }
  }
  // stray dogs asleep by the lanes, near the houses
  if (has('traps', 'dogs')) {
    const nearHouse = (x, y) => houses.some(h => x >= h.x - 4 && x <= h.x + h.w + 3 && y >= h.y - 4 && y <= h.y + h.h + 3);
    for (const [x, y] of all) {

    }
  }
  // strings of firecrackers laid across the lanes
  if (has('traps', 'crackers')) {
    for (const [x, y] of all) {
      if (crackers0.length >= 5) break;
      if (tile(x, y) !== LANE || !far(x, y, 6) || nearExit(x, y, 3) || !spaced(crackers0, x, y, 10)) continue;
      const alongX = tile(x - 1, y) === LANE && tile(x + 1, y) === LANE, alongY = tile(x, y - 1) === LANE && tile(x, y + 1) === LANE;
      if (alongX === alongY) continue;

    }
  }
  // khazan sluice gates where the paddy meets the river; each floods the fields and bunds behind it
  if (has('traps', 'sluice')) {
    for (const [x, y] of all) {
      if (gates.length >= 4) break;
      if (tile(x, y) !== PAD || !D4.some(([dx, dy]) => [WATER, MANG].includes(tile(x + dx, y + dy))) || !far(x, y, 7) || !spaced(gates, x, y, 12)) continue;
      const g = gates.length, q = [[x, y, 0]], reach = CH.monsoon ? 9 : 7;

  if (has('puzzles', 'diyas') && dv) {
    for (const [x, y] of all) {

      if ([GR, MUD, PAD].includes(tile(x, y)) && D4.some(([dx, dy]) => [LANE, ROAD].includes(tile(x + dx, y + dy))) && d > 5 && d < 17 && far(x, y, 5) && spaced(seals, x, y, 5) && !floodOf[y * W + x]) {
        map[y * W + x] = MUD; seals.push({ x, y, order: seals.length + 1, lit: false, t: 0 });
      }

  const ch = exits.find(e => e.kind === 'chapel');
  if (has('puzzles', 'sacristan') && ch) {
    const doors = shuffled(houses.map(h => [h.x + Math.floor(h.w / 2), h.y + h.h]).filter(([x, y]) => !solid(tile(x, y)) && tile(x, y) !== PIT));
    const pickDoor = doors.find(([x, y]) => hyp(x - ch.x, y - ch.y) > 14 && far(x, y, 6)) || doors[0];
    if (pickDoor) { sacr = { x: pickDoor[0] + 0.5, y: pickDoor[1] + 0.5, face: 1, moving: false, alpha: 1, role: { look: { body: '#f1ece2', legs: '#2a2a33', hair: '#cfcac0', h: 1 } } }; ch.locked = 'key'; }
  }
  // shadows have the temple square: ring its bell to drive them out
  const tp = exits.find(e => e.kind === 'temple');
  if (has('puzzles', 'bell') && tp) { BELL = { x: TEMPLE_GATE.x, y: TEMPLE_GATE.y - 0.6 }; tp.locked = 'bell'; }
}

  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (k === ' ' && !e.repeat) callSpirit();
  if (k === 'e' && S && S.mode === 'talk') { e.preventDefault(); trust(); return; }
  if (k === 'q' && S && S.mode === 'talk') { e.preventDefault(); accuse(); return; }
  if (k === 'b' && !e.repeat) toggleBike();
  if (k === 'g' && !e.repeat && S && S.mode === 'play') showGoaMap();
  if (k === 'escape' && S && S.mode === 'play') { showIntro(); return; }
  if ((k === 'z' || k === 'x') && S && S.mode !== 'talk') turnView(k === 'z' ? -1 : 1);
  if (k === '=' || k === '+') zoomBy(1.1);
  if (k === '-' || k === '_') zoomBy(1 / 1.1);
  if (k === 'm' && !e.repeat) SFX.toggle(); else SFX.init();
  keys.add(k);
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());
cv.addEventListener('pointerdown', e => { SFX.init(); joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.dx = joy.dy = 0; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (e.pointerId === joy.id) { joy.dx = e.clientX - joy.ox; joy.dy = e.clientY - joy.oy; } });
const endJoy = e => { if (e.pointerId === joy.id) { joy.id = null; joy.dx = joy.dy = 0; } };
cv.addEventListener('pointerup', endJoy); cv.addEventListener('pointercancel', endJoy);
document.getElementById('callBtn').addEventListener('click', callSpirit);
document.getElementById('rideBtn').addEventListener('click', e => { toggleBike(); e.currentTarget.blur(); });
document.getElementById('btnTrust').addEventListener('click', trust);
document.getElementById('btnBanish').addEventListener('click', accuse);

/* ---------- Rakhondar ---------- */
const spot = (x, y, what) => ({ x, y, tx: Math.floor(x), ty: Math.floor(y), what });
// where the child needs to go next; a locked place sends you to its puzzle first
function objective() {
  if (CH.life) { const q = lifeObjective(); if (q !== undefined) return q; }
  if (S.phase === 'boss') return spot(PYRE.x, PYRE.y, 'the pyre');
  if (S.phase === 'done') return null;
  let e = null;
  if (S.phase === 'ferry') e = exits.find(x => x.kind === 'ferry');
  else if (S.phase === 'zagor') e = S.rung ? null : exits.find(x => x.kind === 'temple');
  else if (S.phase === 'flood') e = exits.find(x => x.kind === 'chapel');
  if (S.phase === 'zagor' && S.rung) return spot(TEMPLE_GATE.x, TEMPLE_GATE.y + 1.5, 'the square');
  if (!e) {
    const n = S.npc;
    if (!n) return null;
    if (n.state === 'find') return spot(n.x, n.y, n.role.name);
    if (n.state !== 'escort') return null;
    e = S.dest;
  }
  if (e.locked === 'seal') { const s = seals.find(p => p.order === S.sealNext); return spot(s.x + 0.5, s.y + 0.5, 'the marked stone'); }
  if (e.locked === 'key' && !S.key) return spot(sacr.x, sacr.y, 'the sacristan');
  if (e.locked === 'bell') return spot(BELL.x, BELL.y, 'the temple bell');
  return { x: e.x, y: e.y, tx: e.tx, ty: e.ty, what: e.label || PLACE_NAMES[e.kind] };
}
// what the objective line says about a locked place
function lockText(e) {
  if (e.locked === 'seal') return `The devli is sealed · Light the marked stones in order (${S.sealNext - 1} of 3)`;
  if (e.locked === 'key') return S.key ? `Take the key to ${PLACE_NAMES.chapel}` : `${PLACE_NAMES.chapel[0].toUpperCase() + PLACE_NAMES.chapel.slice(1)} is locked · Find the sacristan`;
  if (e.locked === 'bell') return S.ringT > 0 ? 'Ringing the bell… stay under it' : 'Shadows hold the temple square · Ring the bell';
  return '';
}
function callSpirit() {
  if (!S || S.mode !== 'play') return;
  if (S.charges <= 0) { whisper('I need light to walk ahead. Find a diya.'); return; }
  const goal = objective();
  if (!goal || dist[goal.ty * W + goal.tx] < 0) return;
  const path = [{ x: goal.tx, y: goal.ty }];
  let cx = goal.tx, cy = goal.ty;
  while (dist[cy * W + cx] > 0) {
    const d = dist[cy * W + cx];
    for (const [dx, dy] of D4) {
      const nx = cx + dx, ny = cy + dy;
      if (nx >= 0 && ny >= 0 && nx < W && ny < H && dist[ny * W + nx] === d - 1) { cx = nx; cy = ny; break; }
    }
    path.push({ x: cx, y: cy });
  }
  path.reverse();
  const shown = path.slice(1, 24);
  shown.forEach((p, i) => {
    const nx = (shown[i + 1] || p).x - p.x || (p.x - (shown[i - 1] || p).x), ny = (shown[i + 1] || p).y - p.y || (p.y - (shown[i - 1] || p).y);
    const side = i % 2 ? 0.14 : -0.14;
    S.prints.push({ x: p.x + 0.5 - ny * side, y: p.y + 0.5 + nx * side, a: Math.atan2(ny, nx), born: S.t + i * 0.07, life: 9 });
  });
  spirit.path = shown; spirit.pi = 0;
  S.charges--;
  SFX.play('call');
  for (const d of demons) if (hyp(d.x - player.x, d.y - player.y) < 5.5) { d.stun = 2.6; d.chasing = false; }
  whisper(shown.length < 23 ? `${goal.what} is close. Follow my footsteps.` : `Follow my footsteps toward ${goal.what}.`);
  renderHud();
}

let whisperTimer = 0;
function whisper(text, voice) {
  const el = document.getElementById('whisper');
  el.textContent = text; el.classList.add('show'); el.classList.toggle('voice', !!voice);
  if (!voice) SFX.play('whisper');
  clearTimeout(whisperTimer);
  whisperTimer = setTimeout(() => el.classList.remove('show'), 4200);
}

/* ---------- update ---------- */
function update(dt) {
  S.t += dt;
  updateFx(dt);
  S.shake = Math.max(0, S.shake - dt);
  if (S.mode !== 'play') return;
  if (!CH.life) S.clock = Math.min(S.phase === 'boss' ? 8 * 60 : 6.9 * 60, S.clock + dt * 0.6);
  if (S.pop) { S.pop.t -= dt; if (S.pop.t <= 0) S.pop = null; }

  let sx = (keys.has('arrowright') || keys.has('d') ? 1 : 0) - (keys.has('arrowleft') || keys.has('a') ? 1 : 0);
  let sy = (keys.has('arrowdown') || keys.has('s') ? 1 : 0) - (keys.has('arrowup') || keys.has('w') ? 1 : 0);
  let mag = sx || sy ? 1 : 0;
  if (joy.id !== null && hyp(joy.dx, joy.dy) > 8) { sx = joy.dx; sy = joy.dy; mag = Math.min(1, hyp(joy.dx, joy.dy) / 45); }
  let [ix, iy] = screenToMap(sx, sy);
  const m = hyp(ix, iy);
  if (m > 0) { ix = ix / m * mag; iy = iy / m * mag; }
  player.moving = mag > 0.05;
  if (player.moving && sx) player.face = Math.sign(sx);
  if (player.moving) { const hm = hyp(ix, iy); player.hx = ix / hm; player.hy = iy / hm; }
  const pTile = at(Math.floor(player.x), Math.floor(player.y));
  // creeping (Shift, or a short drag) is slow but quiet enough to pass a sleeping dog
  const ride = player.bike, wet = flood[Math.floor(player.y) * W + Math.floor(player.x)];
  player.creep = !ride && (keys.has('shift') || (joy.id !== null && mag < 0.55));
  let sp = 4.3 * (pTile === PAD ? 0.6 : 1) * (player.creep ? 0.5 : 1) * (1 - 0.55 * wet);
  if (ride) {
    const surf = [ROAD, LANE, PLAZA, COURT, JETTY].includes(pTile) ? 1 : pTile === PAD ? 0.3 : 0.55;
    const target = player.moving && ride.fuel > 0 ? 9 * surf * mag * (1 - 0.6 * wet) : 0;
    ride.v += (target - ride.v) * Math.min(1, dt * (target > ride.v ? 1.8 : 2.6));
    if (!player.moving) { ix = player.hx; iy = player.hy; }
    else { const k = hyp(ix, iy) || 1; ix /= k; iy /= k; }
    sp = ride.v;
    if (ride.v > 0.4) ride.fuel = Math.max(0, ride.fuel - dt);
  }
  if (S.burnT < 0 && S.fallT <= 0) moveEnt(player, ix * sp * dt, iy * sp * dt);
  if (ride) updateBike(dt);

  // traffic on the main road waits for a child standing in front of it
  for (const c of S.cars) {
    const ax = player.x - c.x, ay = player.y - c.y, ahead = ax * c.dx + ay * c.dy, side = Math.abs(ax * c.dy - ay * c.dx);
    if (!(side < 0.9 && ahead > 0 && ahead < 2.2)) wander(c, ROAD, 3.2, dt, 0.85);
  }
  for (const b of S.boats) wander(b, WATER, 0.7, dt, 0.7);

  const pt = Math.floor(player.y) * W + Math.floor(player.x);
  if (pt !== lastPT) { bfs(Math.floor(player.x), Math.floor(player.y)); lastPT = pt; }
  S.inv -= dt; S.flash = Math.max(0, S.flash - dt * 1.6);

  // diyas: light them as you pass; lit diyas and holy places refill the lamp
  let refuel = holy().some(e => hyp(player.x - e.x, player.y - e.y) < 3);
  for (const l of lights) if (l.kind === 'diya') {
    if (!l.lit && !l.spent && hyp(l.x - player.x, l.y - player.y) < 0.95) {
      l.lit = true; l.life = CH.monsoon ? 20 : 35;   // the rain eats a diya quickly
      SFX.play('chime', l.x, l.y);
      const gained = S.charges < 3; S.charges = Math.min(3, S.charges + 1);
      whisper(gained ? 'The diya holds them back and gives me strength. Fill your lamp while it burns.' : 'The diya holds them back. Fill your lamp while it burns.');
      renderHud();
    }
    if (l.lit) { l.life -= dt; if (hyp(l.x - player.x, l.y - player.y) < 1.4) refuel = true; if (l.life <= 0) { l.lit = false; l.spent = true; } }
  }
  if (refuel) S.oil = Math.min(OIL_MAX, S.oil + dt * 35);
  updateChapter(dt);
  if (S.mode !== 'play') return;
  if (CH.life) updateLife(dt);
  const safe = inSafe(player.x, player.y);

  // the person you are walking home
  if (S.npc) { updateNpc(S.npc, dt); if (S.mode !== 'play') return; }
  if (S.nextT > 0) { S.nextT -= dt; if (S.nextT <= 0) nextRescue(); }

  const npc = S.npc && S.npc.state === 'escort' && S.npc.flee >= 0 ? S.npc : null;
  for (const d of demons.slice()) {
    d.stun -= dt; d.lit -= dt; d.alert = (d.alert || 0) - dt;
    const tx = Math.floor(d.x), ty = Math.floor(d.y), dd = dist[ty * W + tx];
    const nd = npc ? distN[ty * W + tx] : -1;
    // demons go for whoever is easier to reach: the child, or the person being walked home
    const goNpc = npc && nd >= 0 && (dd < 0 || nd < dd) && !inSafe(npc.x, npc.y);
    const field = goNpc ? distN : dist, tgt = goNpc ? npc : player, fd = goNpc ? nd : dd;
    const pd = hyp(d.x - tgt.x, d.y - tgt.y);
    if (d.stun > 0 || fd < 0 || (!goNpc && safe)) d.chasing = false;
    else d.chasing = (d.alert > 0 && fd < 40) || (d.chasing ? fd < 18 : (pd < 6.5 && fd < 11));
    if (d.chasing && !S.seen) { S.seen = true; whisper('Something is moving in the dark. Your lamp will burn it if it comes close.'); }

    let v = null, spd;
    if (d.stun > 0 && dd >= 0) {
      let best = null, bd = -1;
      for (const [ax, ay] of D4) { const n = dist[(ty + ay) * W + tx + ax]; if (n > bd) { bd = n; best = [ax, ay]; } }
      if (best) v = [tx + best[0] + 0.5 - d.x, ty + best[1] + 0.5 - d.y];
      spd = 3.0;
    } else if (d.chasing) {
      v = downhill(field, d, tx, ty) || [tgt.x - d.x, tgt.y - d.y];
      spd = (d.big ? 3.3 : 3.6) + Math.min(0.5, S.t / 300);
    } else if (d.guard && hyp(d.x - d.guard.x, d.y - d.guard.y) > 2.5) {
      v = [d.guard.x - d.x, d.guard.y - d.y]; spd = 1.6;   // a guard drifts back to the square it holds
    } else {
      d.wt -= dt;
      if (d.wt <= 0 || solid(at(tx + d.dir[0], ty + d.dir[1]))) {
        const open = D4.filter(([ax, ay]) => !solid(at(tx + ax, ty + ay)));
        d.dir = open.length ? open[Math.floor(rand() * open.length)] : d.dir;
        d.wt = 1 + rand() * 2;
      }
      v = [tx + d.dir[0] + 0.5 - d.x, ty + d.dir[1] + 0.5 - d.y];
      spd = 1.4;
    }
    const vm = v ? hyp(v[0], v[1]) : 0;
    if (vm > 0.01) {
      if (at(tx, ty) === PAD) spd *= 0.65;
      if (d.lit > 0) spd *= 0.45;
      const mx = v[0] / vm * spd * dt, my = v[1] / vm * spd * dt;
      if (inSafe(d.x + mx * 4, d.y + my * 4)) { d.chasing = false; d.wt = 0; d.dir = [-d.dir[0], -d.dir[1]]; }
      else steer(d, mx, my, dt);
    }
    if (goNpc && d.stun <= 0 && hyp(d.x - npc.x, d.y - npc.y) < 0.6) { captured(); break; }
    if (player.bike && player.bike.v > 3 && d.stun <= 0 && hyp(d.x - player.x, d.y - player.y) < 0.75) {
      if (!d.big) banish(d); else d.stun = 2;
      dismount(true); hurt(d.x, d.y);
      if (S.mode !== 'play') return;
      continue;
    }
    if (!safe && S.inv <= 0 && d.stun <= 0 && hyp(d.x - player.x, d.y - player.y) < 0.62) {
      d.stun = 1.4; hurt(d.x, d.y);
      if (S.mode !== 'play') return;
    }
  }

  // the blessed lamp burns the nearest demon in front of the child: turn to face what is coming
  S.beam = null;
  const ahead = e => { const ex = e.x - player.x, ey = e.y - player.y, m = hyp(ex, ey); return m < LAMP_POINT || (ex * player.hx + ey * player.hy) / m > LAMP_CONE; };
  if (S.oil > 0) {
    let best = null, bd = LAMP_RANGE;
    for (const d of demons) { const dd = hyp(d.x - player.x, d.y - player.y); if (dd < bd && ahead(d)) { bd = dd; best = d; } }
    if (best) {
      best.hp -= dt * 0.8; best.lit = 0.15; S.beam = best;
      S.oil = Math.max(0, S.oil - dt * 8);
      if (best.hp <= 0) { banish(best); S.beam = null; }
    } else if (S.boss && S.burnT < 0 && hyp(S.boss.x - player.x, S.boss.y - player.y) < LAMP_RANGE + 0.5 && ahead(S.boss)) {
      S.boss.lit = 0.15; S.beam = S.boss; S.oil = Math.max(0, S.oil - dt * 8);
    }
  }

  if (S.boss) updateBoss(S.boss, dt);
  if (S.mode !== 'play') return;

  // the night thickens as it goes on
  S.spawnT -= dt;
  const want = CH.life ? (isNight() ? 6 + (S.moon && S.moon.illum < 0.15 ? 3 : 0) : 0) : S.burnT >= 0 || S.ending ? 0 : 5 + CH.extra + S.ri + (S.boss ? 2 : 0) + (['ferry', 'zagor', 'flood'].includes(S.phase) ? 3 : 0);
  if (S.spawnT <= 0) { if (demons.length < want) spawnDemon(); S.spawnT = 3; }

  if (spirit.path) {
    const p = spirit.path[Math.min(spirit.path.length - 1, Math.floor(spirit.pi))];
    spirit.x += (p.x + 0.5 - spirit.x) * Math.min(1, dt * 10);
    spirit.y += (p.y + 0.5 - spirit.y) * Math.min(1, dt * 10);
    spirit.pi += dt * 12;
    if (spirit.pi > spirit.path.length + 6) spirit.path = null;
  } else {
    const a = S.t * 1.3;
    const tx = player.x - 0.6 + Math.cos(a) * 0.6, ty = player.y - 0.6 + Math.sin(a) * 0.6;
    spirit.x += (tx - spirit.x) * Math.min(1, dt * 3);
    spirit.y += (ty - spirit.y) * Math.min(1, dt * 3);
  }
  S.prints = S.prints.filter(p => S.t - p.born < p.life);
  setObjective();
}

function updateNpc(n, dt) {
  const pd = hyp(n.x - player.x, n.y - player.y);
  if (n.state === 'find') { if (pd < 1.3) openTalk(); return; }
  if (n.state === 'leave' || n.state === 'home') {
    n.alpha -= dt * 0.5;
    if (n.state === 'leave') moveEnt(n, -n.face * dt * 0.8, dt * 0.8);
    if (n.alpha <= 0) S.npc = null;
    return;
  }
  if (n.pillion) { n.x = player.x - player.hx * 0.45; n.y = player.y - player.hy * 0.45; n.panic = 0; n.moving = false; if (Math.abs(player.hx - player.hy) > 0.1) n.face = Math.sign(player.hx - player.hy); }
  const tx = Math.floor(n.x), ty = Math.floor(n.y);
  if (n.tile !== ty * W + tx) { n.tile = ty * W + tx; bfs(tx, ty, distN); }
  // fear builds when a demon is near and neither your lamp nor a holy light covers them
  let threat = null, td = 1e9;
  for (const d of demons) { const dd = hyp(d.x - n.x, d.y - n.y); if (dd < td) { td = dd; threat = d; } }
  const covered = (pd < 2.6 && S.oil > 0) || inSafe(n.x, n.y);
  n.panic = Math.max(0, Math.min(1, n.panic + (threat && td < 3.2 && !covered ? dt * 0.5 : -dt * 0.25)));
  if (n.panic >= 1 && n.flee <= 0) { n.flee = 2.5; whisper(`${n.role.name} panics and runs! Catch up with them.`); }
  let v = null, spd = 3.7;
  if (n.pillion) {
  } else if (n.flee > 0) {
    n.flee -= dt; spd = 4;
    if (threat) v = [n.x - threat.x, n.y - threat.y];
    if (n.flee <= 0) n.panic = 0.5;
  } else if (distD[ty * W + tx] >= 0 && distD[ty * W + tx] <= 4) {
    // home is in sight: they hurry the last few steps on their own
    if (hyp(n.x - S.dest.x, n.y - S.dest.y) > 0.3) v = downhill(distD, n, tx, ty) || [S.dest.x - n.x, S.dest.y - n.y];
  } else if (pd > 1.3) {
    v = downhill(dist, n, tx, ty) || [player.x - n.x, player.y - n.y];
  }
  if (v) {
    const vm = hyp(v[0], v[1]);
    if (vm > 0.01) {
      if (at(tx, ty) === PAD) spd *= 0.6;
      spd *= 1 - 0.55 * flood[ty * W + tx];
      steer(n, v[0] / vm * spd * dt, v[1] / vm * spd * dt, dt);
      const s = v[0] - v[1]; if (Math.abs(s) > 0.05) n.face = Math.sign(s);
    }
  }
  n.moving = !!v;
  // a demon in disguise drops the act near holy ground, at a ride home, or once it has you somewhere dark
  if (n.fake) {
    n.fakeT += dt;
    const nearHoly = holy().some(e => hyp(n.x - e.x, n.y - e.y) < 4.5);
    const atRide = (S.dest.need || S.dest.edge) && hyp(n.x - S.dest.x, n.y - S.dest.y) < S.dest.r + 1.2;
    if (nearHoly || atRide || n.fakeT > n.fakeAt) return reveal(false);
  }
  const d = S.dest, nd = hyp(n.x - d.x, n.y - d.y);
  if (d.need) {
    if (nd < d.r + 0.6 && hyp(player.x - d.x, player.y - d.y) < d.r + 1) {
      if (!d.told) { d.told = true; if (d.kind === 'ferry') SFX.play('ferryHorn', ...ferryPos(d), 30); whisper(d.kind === 'bus' ? 'Wait here with him for the pilot. Keep the shadows off.' : 'The ferry is crossing. Hold the jetty until it lands.'); }
      d.wait += dt;
      if (d.wait >= d.need) deliver();
    }
  } else if (nd < d.r && !d.locked) deliver();
}

function updateBoss(b, dt) {
  if (S.burnT >= 0) {
    S.burnT += dt;
    for (const d of demons.slice()) if (rand() < dt * 0.8) banish(d);
    if (S.burnT > 4) S.dawn = Math.min(1, S.dawn + dt / 3);
    if (S.dawn >= 1) endNight('dawn');
    return;
  }
  const tx = Math.floor(b.x), ty = Math.floor(b.y);
  b.lit -= dt;
  const v = downhill(dist, b, tx, ty) || [player.x - b.x, player.y - b.y], vm = hyp(v[0], v[1]);
  const spd = 2.5 * (b.lit > 0 ? 0.55 : 1);
  if (vm > 0.01) { steer(b, v[0] / vm * spd * dt, v[1] / vm * spd * dt, dt); b.step += dt * spd; }
  // a ground slam where the child stands, with a moment's warning
  b.slamT -= dt;
  if (!b.slam && b.slamT <= 0 && hyp(b.x - player.x, b.y - player.y) < 4.5) b.slam = { x: player.x, y: player.y, t: 1.1 };
  if (b.slam) {
    b.slam.t -= dt;
    if (b.slam.t <= 0) {
      S.shake = 0.5;
      SFX.play('slam', b.slam.x, b.slam.y, 24);
      if (hyp(player.x - b.slam.x, player.y - b.slam.y) < 1.6) hurt(b.slam.x, b.slam.y);
      b.slam = null; b.slamT = 5;
      if (S.mode !== 'play') return;
    }
  }
  if (hyp(b.x - player.x, b.y - player.y) < 0.95) { hurt(b.x, b.y); if (S.mode !== 'play') return; }
  b.spawnT -= dt;
  if (b.spawnT <= 0) { spawnDemon(b); b.spawnT = 7; }
  if (hyp(b.x - PYRE.x, b.y - PYRE.y) < 1.5) {
    S.burnT = 0; S.shake = 0.6;
    SFX.play('ignite');
    whisper('The whole vaddo rushes in with torches. The pyre catches, and Narkasur burns!');
  }
}

/* ---------- traps, puzzles and the chapter's ending, every frame ---------- */
// a noise that every demon within r hears: they come looking, and one more crawls out of the dark nearby
function alarm(x, y, r) {
  if (CH.life && !isNight()) return;   // by day a bark or a splash is only a bark or a splash
  for (const d of demons) if (hyp(d.x - x, d.y - y) < r) d.alert = 7;
  const d = spawnDemon({ x, y });
  if (d) d.alert = 7;

function updateFx(dt) {

    for (const p of props) if (p.kind === 'effigy' && !p.awake && hyp(p.x - player.x, p.y - player.y) < 22)
      S.smoke.push({ x: p.x + 0.5 + (rand() - 0.5) * 1.5, y: p.y + 0.5 + (rand() - 0.5) * 1.5, born: S.t, life: 6, vz: 8 + rand() * 6, dx: 0.12 + rand() * 0.1 });
  }

    if (effs.length) {

  S.smoke = S.smoke.filter(s => S.t - s.born < s.life);

function setObjective() {

const turnSnap = document.createElement('canvas'), turnNew = document.createElement('canvas');

  ROT = (ROT + d + 4) % 4; OX = (ROT % 2 ? W : H) * HW;

    if (st.lit) { const f = 1 + Math.sin(t * 15 + st.x) * 0.15; ctx.fillStyle = '#9fe8d6'; ctx.beginPath(); ctx.ellipse(sx, sy - 13, 2.4 * f, 5 * f, 0, 0, 7); ctx.fill(); }

  }
  const dvx = exits.find(e => e.kind === 'devli');
  if (dvx && dvx.locked) for (let x = dvx.tx; x <= dvx.tx + 1; x++) {
    const [sx, sy] = iso(x + 0.5, dvx.ty + 0.5);

    }
  }
  // the bell's ringing ring
  if (BELL && S.ringT > 0) { const [sx, sy] = iso(BELL.x, BELL.y); ctx.strokeStyle = 'rgba(242,180,65,.95)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx, sy - 80, 9, -Math.PI / 2, -Math.PI / 2 + S.ringT / 3 * Math.PI * 2); ctx.stroke(); }

  // diyas lying on the lanes
  for (const l of lights) if (l.kind === 'diya') {
    const [sx, sy] = iso(l.x, l.y);

  // standing things, back to front

  for (const d of S.dogs) { const [sx, sy] = iso(d.x, d.y); if (inView(sx, sy)) list.push({ key: depth(d.x, d.y), draw: g => drawDog(g, d) }); }
  if (sacr) list.push({ key: depth(sacr.x, sacr.y), draw: g => { drawPerson(g, sacr); if (!S.key) { const [sx, sy] = iso(sacr.x, sacr.y); g.strokeStyle = '#d9c27a'; g.lineWidth = 1.5; g.beginPath(); g.arc(sx + 9, sy - 18, 3, 0, 7); g.stroke(); line(g, [sx + 9, sy - 15], [sx + 9, sy - 8], '#d9c27a', 1.5); } } });
  if (CH.life && S.quest && !isNight()) {

    } });

  list.sort((a, b) => a.key - b.key);

  // night: a moonlit blue dark, cut open by every light as an ellipse on the ground

  dctx.globalCompositeOperation = 'destination-out';

  const hole = (wx, wy, r, a, lift = 0) => {

  for (const c of S.crackers) if (c.state === 'pop') hole(c.x, c.y, 2.6, 0.6, 2);

  ctx.setTransform(1, 0, 0, 1, 0, 0);

  // warm light pooling around lamps

  // moon glinting on the river

  }

  for (const s of S.smoke) {

    ctx.fillStyle = `rgb(${l.color})`;

    for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6, r = i % 2 ? 3 : 7; ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }

        ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(bx, by, 1.6, 0, 7); ctx.fill();

    const age = t - b.born, [bx, by] = P(b.x, b.y, b.z);
    if (!inView(bx, by)) continue;
    for (let i = 0; i < 16; i++) {
      const a = i * Math.PI / 8, r = age * (b.small ? 16 : 55), x = bx + Math.cos(a) * r, y = by + Math.sin(a) * r * 0.8 + age * age * 30;
      ctx.fillStyle = `rgba(${b.hue},${Math.max(0, 1 - age / 1.4)})`; ctx.beginPath(); ctx.arc(x, y, 1.8, 0, 7); ctx.fill();
    }
  }
  // footsteps of the Rakhondar, pressed into the ground
  for (const p of S.prints) {
    const age = t - p.born; if (age <= 0) continue;
    const a = Math.min(1, age * 3, (p.life - age) / 2);
    ctx.fillStyle = `rgba(159,232,214,${0.8 * a})`;
    onGround(ctx, p.x, p.y, c => {
      c.rotate(p.a);
      c.beginPath(); c.ellipse(0, 0, 5, 3, 0, 0, 7); c.fill();

  }

  for (const f of fireflies) {
    const [sx, sy] = P(f.x + Math.sin(t * 0.5 + f.ph) * 0.7, f.y + Math.cos(t * 0.4 + f.ph * 1.3) * 0.7, 10 + Math.sin(t + f.ph) * 6);
    if (!inView(sx, sy)) continue;

    ctx.fillStyle = `rgba(230,255,160,${a})`; ctx.beginPath(); ctx.arc(sx, sy, 1.4, 0, 7); ctx.fill();
  }
  // the pyre burning, Narkasur in flames
  for (const f of S.fire) {
    const age = (t - f.born) / f.life, [fx, fy] = P(f.x, f.y, 10 + age * f.vz);
    ctx.fillStyle = `rgba(255,${Math.round(200 - age * 150)},60,${0.8 * (1 - age)})`;

  }

  }

  if (S.oil > 0 && S.mode === 'play') {
    const a = Math.atan2(player.hy, player.hx), r = LAMP_RANGE * 32, w = Math.acos(LAMP_CONE);
    ctx.globalCompositeOperation = 'lighter';

      g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, r, a - w, a + w); g.closePath(); g.fill();
    });

  if (S.beam) {
    const [ax, ay] = iso(player.x, player.y), [bx, by] = iso(S.beam.x, S.beam.y), lift = S.beam === S.boss ? 90 : 22;
    ctx.globalCompositeOperation = 'lighter';
    for (const [w, a] of [[9, 0.18], [4, 0.45], [1.6, 0.9]]) {

      ctx.beginPath(); ctx.moveTo(ax + player.face * 6, ay - 22); ctx.lineTo(bx + Math.sin(t * 30) * 2, by - lift); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  // the child's lamp
  { const [ax, ay] = iso(player.x, player.y); ctx.fillStyle = S.oil > 0 ? '#ffd36b' : '#5a4a3a'; ctx.beginPath(); ctx.ellipse(ax + player.face * 6, ay - 22, 2.6, 3.6, 0, 0, 7); ctx.fill(); }
  // banished demons breaking into sparks
  for (const p of S.puffs) {
    const age = (t - p.born) / 0.9, [sx, sy] = iso(p.x, p.y);
    for (let i = 0; i < (p.big ? 18 : 10); i++) {
      const a = i * 2.4, r = age * (p.big ? 50 : 32);
      ctx.fillStyle = i % 2 ? `rgba(200,170,255,${1 - age})` : `rgba(255,240,200,${1 - age})`;
      ctx.beginPath(); ctx.arc(sx + Math.cos(a) * r, sy - 20 + Math.sin(a) * r * 0.6 - age * 20, 2, 0, 7); ctx.fill();

  }

  if (S.npc && S.npc.alpha > 0) {
    const n = S.npc, [sx, sy] = iso(n.x, n.y), top = sy - 48 * n.role.look.h;
    if (n.state === 'find') {
      const p = 1 + Math.sin(t * 4) * 0.15;
      ctx.fillStyle = 'rgba(236,228,207,.2)'; ctx.beginPath(); ctx.arc(sx, top - 8, 12 * p, 0, 7); ctx.fill();
      ctx.fillStyle = '#ece4cf'; ctx.font = '700 16px Mukta, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('!', sx, top - 2); ctx.textAlign = 'left';

  [15.75, 74.05], [15.80, 73.90]];
// where each village's name sits beside its dot, so the close ones around the Mandovi don't overlap
const GOA_LABEL = { chorao: [-9, -6, 'end'], divar: [2, -10, 'middle'], tonca: [9, 12, 'start'] };
const goaXY = (lat, lon) => [+((lon - 73.64) * 620).toFixed(1), +((15.83 - lat) * 620).toFixed(1)];
function showGoaMap() {
  const paused = !!S && S.mode === 'play';
  if (paused) S.mode = 'paused';
  const here = S && CH.life ? CH.village : null;
  const vils = Object.keys(VILLAGE_TALUKA);
  const svg = `<svg viewBox="0 0 420 570" role="img" aria-label="Sketch map of Goa with its talukas and the villages you can visit">
    <polygon points="${GOA_OUTLINE.map(([a, b]) => goaXY(a, b).join(',')).join(' ')}" fill="rgba(68,115,58,.22)" stroke="rgba(236,228,207,.35)" stroke-width="1.5"/>
    ${TALUKAS.map(t => { const [x, y] = goaXY(...t.c), has = vils.some(v => VILLAGE_TALUKA[v] === t.id); return `<text x="${x}" y="${y}" text-anchor="middle" opacity="${has ? 1 : 0.55}">${t.name}</text>`; }).join('')}
    ${vils.map(v => { const [x, y] = goaXY(...VILLAGES[v].centre), me = v === here, lb = GOA_LABEL[v] || [9, 4, 'start'];
      return `<g class="vil" data-v="${v}" tabindex="0" role="button" aria-label="${me ? 'You are in' : 'Go to'} ${VILLAGE_TITLES[v]}"><circle cx="${x}" cy="${y}" r="${me ? 7 : 5.5}" fill="${me ? '#f2b441' : '#9fe8d6'}" stroke="#070a16" stroke-width="2"/><text x="${x + lb[0]}" y="${y + lb[1]}" text-anchor="${lb[2]}">${VILLAGE_TITLES[v].replace(/ island$/, '')}</text></g>`; }).join('')}
  </svg>`;
  const list = TALUKAS.map(t => {
    const vs = vils.filter(v => VILLAGE_TALUKA[v] === t.id);
    return `<div><b>${t.name}</b>${vs.length ? vs.map(v => `<button class="go" type="button" data-v="${v}" ${v === here ? 'disabled' : ''}>${v === here ? 'You are in ' : ''}${VILLAGE_TITLES[v]}</button>`).join('') : '<span class="none">not mapped yet</span>'}</div>`;
  }).join('');
  card.innerHTML = `
    <span class="eyebrow">Goa · twelve talukas</span>
    <h1>Where to?</h1>
    <p>${here ? `You are in ${VILLAGE_TITLES[here]}, ${talukaOf(here).name} taluka. Take the bus or the ferry to another village: the clock, your points and your streak come with you.` : 'Pick a village to live in on Goa time. You can travel to another one whenever you like.'}</p>
    <div class="goa">${svg}<div class="taluka-list">${list}</div></div>
    <p style="font-size:12px;color:var(--muted)">A rough sketch, not to scale. Villages sit at their real coordinates; taluka names mark roughly where each one lies.</p>
    <div class="row"><button class="${paused ? 'start' : 'ghost'}" id="goaBack" type="button">${paused ? 'Back to the village' : 'Back'}</button></div>`;
  screen.hidden = false;
  const go = v => { if (v && v !== here) travelTo(v); };
  for (const b of card.querySelectorAll('[data-v]')) {
    b.onclick = () => go(b.dataset.v);
    b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); go(b.dataset.v); } };
  }
  document.getElementById('goaBack').onclick = () => { if (paused) { S.mode = 'play'; screen.hidden = true; } else showIntro(); };
  document.getElementById('goaBack').focus();
}
function travelTo(v) {
  const from = S && CH.life ? CH.village : null;
  const keep = from ? { dayMin: S.dayMin, dayIdx: S.dayIdx, points: S.points } : null;
  CH = lifeChapter(v);
  const m = MODE; MODE = 'real'; start(); MODE = m;
  if (!keep) return;
  Object.assign(S, keep); newLifeDay();
  if (!isNight()) demons.length = 0;
  const how = [from, v].some(x => x === 'divar' || x === 'chorao') ? 'ferry' : 'bus';
  const cross = VILLAGE_TALUKA[from] !== VILLAGE_TALUKA[v];
  whisper(`You take the ${how} from ${VILLAGE_TITLES[from]} to ${VILLAGE_TITLES[v]}${cross ? `, into ${talukaOf(v).name} taluka` : ''}. ${clockText()}.`);
}

/* ---------- loop ---------- */
let last = performance.now(), miniT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render(); if (turnAnim) compositeTurn(dt); SFX.tick(dt);
  if ((miniT -= dt) <= 0) { miniT = 0.12; drawMini(); }
  requestAnimationFrame(frame);
}
resize();
newGame();
showIntro();
requestAnimationFrame(frame);
</script>
