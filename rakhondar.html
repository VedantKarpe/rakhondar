<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rakhondar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Yatra+One&display=swap">
<style>
/* Layout: one full-bleed isometric night canvas; HUD floats at the edges; story cards sit over the village */
:root {
  --night: #070a16;
  --ink: #ece4cf;
  --muted: #9aa0b4;
  --laterite: #b8562f;
  --lamp: #f2b441;
  --spirit: #9fe8d6;
  --card: rgba(9, 12, 26, 0.88);
  --display: "Yatra One", "Mukta", Georgia, serif;
  --body: "Mukta", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }
#wrap { position: relative; height: 100%; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.hud {
  position: absolute; top: 12px;
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; gap: 12px; pointer-events: none;
}
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat.right { align-items: flex-end; }
.lbl { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.pips { display: flex; gap: 6px; }
.pip { width: 12px; height: 16px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: #2a2d3a; }
.pip.on.courage { background: var(--lamp); box-shadow: 0 0 10px var(--lamp); }
.pip.spirit { border-radius: 50%; height: 12px; }
.pip.on.spirit { background: var(--spirit); box-shadow: 0 0 10px var(--spirit); }

#objective {
  position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
  font-size: 14px; color: var(--muted); text-align: center; pointer-events: none;
  max-width: calc(100% - 32px);
}
#whisper {
  position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%);
  max-width: min(32rem, calc(100% - 32px)); text-align: center;
  font-family: var(--display); font-size: 20px; color: var(--spirit);
  text-shadow: 0 0 14px rgba(159, 232, 214, 0.55);
  opacity: 0; transition: opacity 0.5s; pointer-events: none;
}
#whisper.show { opacity: 1; }
/* the voice in the dark speaks in a different colour from the Rakhondar */
#whisper.voice { color: #c9a8ff; font-style: italic; text-shadow: 0 0 14px rgba(170, 120, 255, 0.6); }
.chapters { display: grid; gap: 8px; }
.chapter {
  display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 4px 12px; text-align: left;
  font: 15px var(--body); color: var(--ink); background: rgba(236, 228, 207, 0.04); cursor: pointer;
  border: 1px solid rgba(236, 228, 207, 0.18); border-radius: 6px; padding: 10px 14px;
}
.chapter:hover { border-color: rgba(242, 180, 65, 0.6); }
.chapter .num { font-family: var(--display); font-size: 20px; color: var(--lamp); }
.chapter .where { grid-column: 2; font-size: 13px; color: var(--muted); }
.chapter .done { color: var(--spirit); font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
.field input {
  font: 16px var(--body); color: var(--ink); background: rgba(236, 228, 207, 0.06);
  border: 1px solid rgba(236, 228, 207, 0.3); border-radius: 6px; padding: 9px 12px; max-width: 16rem;
}
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
#askBtn {
  position: absolute; bottom: 72px; right: max(16px, env(safe-area-inset-right, 0px));
  font: 600 15px var(--body); color: var(--night); background: var(--ink); border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer;
}
#askBtn kbd { font: inherit; font-weight: 400; opacity: 0.7; margin-left: 4px; }
#rideBtn {
  position: absolute; bottom: 20px; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 190px);
  font: 600 15px var(--body); color: var(--night); background: var(--lamp);
  border: 0; border-radius: 999px; padding: 12px 18px; cursor: pointer;
}
#rideBtn kbd { font: inherit; font-weight: 400; opacity: 0.7; margin-left: 4px; }
#callBtn {
  position: absolute; bottom: 20px; right: max(16px, env(safe-area-inset-right, 0px));
  font: 600 15px var(--body); color: var(--night); background: var(--spirit);
  border: 0; border-radius: 999px; padding: 12px 18px; cursor: pointer;
  box-shadow: 0 0 22px rgba(159, 232, 214, 0.45);
}
#callBtn:disabled { background: #3a4150; color: var(--muted); box-shadow: none; cursor: default; }
#callBtn kbd { font: inherit; font-weight: 400; opacity: 0.7; margin-left: 4px; }
button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 3px; }

.screen {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at center, rgba(7, 10, 22, 0.4), rgba(7, 10, 22, 0.88));
}
.card {
  max-width: 34rem; background: var(--card); border: 1px solid rgba(242, 180, 65, 0.25);
  border-radius: 6px; padding: 28px; display: flex; flex-direction: column; gap: 14px;
  max-height: 100%; overflow-y: auto;
}
.eyebrow { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lamp); }
.card h1 { font-family: var(--display); font-weight: 400; font-size: 46px; line-height: 1; margin: 0; text-wrap: balance; }
.card h1 small { display: block; font-size: 22px; color: var(--spirit); margin-top: 8px; }
.card p { margin: 0; font-size: 16px; line-height: 1.55; color: #d6cfbd; }
.controls { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; color: var(--muted); }
.controls b { color: var(--ink); font-weight: 600; }
.start {
  align-self: flex-start; font: 700 16px var(--body); color: var(--night); background: var(--lamp);
  border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer;
}
.sound {
  pointer-events: auto; font: 600 12px var(--body); color: var(--muted); background: rgba(9, 12, 26, 0.5);
  border: 1px solid rgba(236, 228, 207, 0.25); border-radius: 999px; padding: 4px 11px; cursor: pointer; margin-top: 4px;
}
.pts { font: 700 16px var(--body); color: var(--lamp); }
.today { display: grid; gap: 6px; padding: 12px 14px; border-radius: 6px; background: rgba(242, 180, 65, 0.08); border: 1px solid rgba(242, 180, 65, 0.3); }
.today b { color: var(--lamp); }
.badge { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--night); background: var(--lamp); border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
.board { font-size: 13px; color: var(--muted); display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; }
.turn { display: flex; gap: 6px; pointer-events: auto; }
.credit {
  position: absolute; bottom: 8px; left: max(16px, env(safe-area-inset-left, 0px)); max-width: 55%;
  font-size: 11px; color: var(--muted); opacity: 0.8; pointer-events: none;
}
.oil { width: 96px; height: 6px; border-radius: 3px; background: #2a2d3a; overflow: hidden; }
.oil span { display: block; height: 100%; width: 100%; background: var(--lamp); transition: width 0.15s; }
.talk {
  position: absolute; left: 0; right: 0; bottom: 76px; display: flex; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.talk-card {
  max-width: 30rem; width: 100%; background: var(--card); border: 1px solid rgba(159, 232, 214, 0.3);
  border-radius: 6px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;
}
.talk-card p { margin: 0; font-size: 16px; line-height: 1.5; color: #e2dbc6; }
.talk-card .hint { font-size: 13px; color: var(--spirit); }
.talk-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.ghost {
  font: 600 15px var(--body); color: var(--ink); background: transparent; cursor: pointer;
  border: 1px solid rgba(236, 228, 207, 0.4); border-radius: 999px; padding: 11px 20px;
}
.talk kbd, .start kbd { font: inherit; font-weight: 400; opacity: 0.6; margin-left: 4px; }
.summary { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.summary b { color: var(--ink); font-weight: 600; text-align: right; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 520px) {
  .card { padding: 20px; }
  .card h1 { font-size: 36px; }
  #whisper { font-size: 17px; bottom: 150px; }   /* clear of the mini map */
}
/* the mini map: the whole village, turned the same way as the view */
#miniWrap {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 28px;
  display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
}
#mini {
  width: 200px; height: 130px; border-radius: 6px; cursor: pointer; touch-action: manipulation;
  background: rgba(9, 12, 26, 0.78); border: 1px solid rgba(236, 228, 207, 0.25);
}
#miniWrap .sound { margin-top: 0; }
.goa { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.goa svg { width: 100%; max-height: 52vh; }
.goa svg text { font: 600 13px var(--body); fill: var(--muted); }
.goa svg .vil { cursor: pointer; }
.goa svg .vil text { fill: var(--ink); font-size: 12px; }
.taluka-list { display: grid; gap: 6px; font-size: 14px; }
.taluka-list > div { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.taluka-list b { min-width: 7.5rem; color: var(--ink); }
.taluka-list .none { color: var(--muted); font-size: 13px; }
.go { font: 600 13px var(--body); color: var(--night); background: var(--lamp); border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.go[disabled] { background: var(--spirit); cursor: default; }
@media (max-width: 520px) { #mini { width: 140px; height: 92px; } #miniWrap { bottom: 72px; } }
@media (prefers-reduced-motion: reduce) { #whisper { transition: none; } }
</style>

<div id="wrap">
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="stat"><span class="lbl">Courage</span><div class="pips" id="hearts"></div><span class="lbl">Lamp oil</span><div class="oil"><span id="oilFill"></span></div></div>
    <div class="stat right"><span class="lbl">Rakhondar calls</span><div class="pips" id="charges"></div><span class="lbl">Points</span><b class="pts" id="points">0</b><button class="sound" id="soundBtn" type="button">Sound on <kbd>M</kbd></button><div class="turn"><button class="sound" id="turnL" type="button" aria-label="Turn the view left">⟲</button><button class="sound" id="turnR" type="button" aria-label="Turn the view right">⟳</button></div></div>
  </div>
  <div id="objective"></div>
  <div id="whisper" aria-live="polite"></div>
  <div class="credit" id="credit"></div>
  <div id="miniWrap"><canvas id="mini" width="192" height="96" aria-label="Mini map of the village. Opens the village map." role="button" tabindex="0"></canvas><div class="turn"><button class="sound" id="placesBtn" type="button">Places <kbd>P</kbd></button><button class="sound" id="goaBtn" type="button">Goa <kbd>G</kbd></button></div></div>
  <button id="callBtn" type="button">Call Rakhondar <kbd>Space</kbd></button>
  <button id="rideBtn" type="button" hidden>Ride <kbd>B</kbd></button>
  <button id="askBtn" type="button" hidden>Ask the way <kbd>E</kbd></button>
  <div class="talk" id="talk" hidden>
    <div class="talk-card">
      <span class="eyebrow" id="talkWho"></span>
      <p id="talkLine"></p>
      <p class="hint" id="talkHint"></p>
      <div class="talk-actions">
        <button class="start" id="btnTrust" type="button">Walk with them <kbd>E</kbd></button>
        <button class="ghost" id="btnBanish" type="button">Banish the demon <kbd>Q</kbd></button>
      </div>
    </div>
  </div>
  <div class="screen" id="screen">
    <div class="card" id="card"></div>
  </div>
</div>

  const clampOff = (o, x0, y0, x1, y1) => [Math.max(1 - x0, Math.min(W - 2 - x1, o[0])), Math.max(1 - y0, Math.min(H - 2 - y1, o[1]))];
  const A = V.anchors;
  const want = (a, cx, cy, fx, fy) => a ? [Math.round(a[0] - cx), Math.round(a[1] - cy)] : [Math.round(fx - cx), Math.round(fy - cy)];
  OFF.t = clampOff(want(A.temple || A.worship, 35.5, 4.9, W * 0.7, H * 0.2), 30, 1, 41, 10);
  OFF.c = clampOff(want(A.chapel, 35, 24, W * 0.3, H * 0.5), 29, 21, 40, 31);
  // keep the chapel square clear of the temple grounds

  for (let k = 0; k < 40 && overlap(); k++) OFF.c = clampOff([OFF.c[0] + (OFF.c[0] + 35 < OFF.t[0] + 35.5 ? -1 : 1), OFF.c[1] + (k % 2)], 29, 21, 40, 31);

// family names for the houses: Catholic families keep a cross in the yard, Hindu families a tulsi (as the game draws them)

  cross: ['Fernandes', 'D’Souza', 'Rodrigues', 'Pereira', 'Dias', 'Colaço', 'Mascarenhas', 'Lobo', 'Gomes', 'Furtado', 'Menezes', 'Noronha', 'Carvalho', 'Vaz', 'Almeida', 'Coutinho'],

const FIRST_NAMES = ['Maria', 'Ravi', 'Joaquim', 'Sunita', 'Anil', 'Fatima', 'Prakash', 'Agnes', 'Savio', 'Lata', 'Rohit', 'Bernadette', 'Ganesh', 'Lourdes', 'Nilesh', 'Conceição', 'Suresh', 'Anita', 'Peter', 'Rekha'];
function gen(seed) {

  L_CONNECTED = !!L.connect;
  CITY = !!(L.connect && VILLAGE.tile >= 18);
  if (L.connect && CH.names) Object.assign(PLACE_NAMES, CH.names);
  if (L.bus) OFF.s = [L.bus[0] - 51, L.bus[1] - RY];
  const [tx, ty] = OFF.t, [cx, cy] = OFF.c, [bx, by] = OFF.s;

  // temple grounds, chapel square with its cross and the pyre, the jetty and the bus shelter
  fill(30 + tx, 1 + ty, 41 + tx, 9 + ty, COURT);
  fill(33 + tx, 2 + ty, 37 + tx, 7 + ty, TEMPLE);
  set(31 + tx, 7 + ty, TEMPLE);
  fill(29 + cx, 21 + cy, 40 + cx, 30 + cy, PLAZA);
  fill(33 + cx, 22 + cy, 36 + cx, 25 + cy, CHAPEL);
  if (!CITY) { set(34 + cx, 28 + cy, PROP); props.push({ kind: 'bigcross', x: 34 + cx, y: 28 + cy }); }   // a city church's square has its stairways instead
  PYRE = { x: 31.5 + cx, y: 28.5 + cy };
  TEMPLE_GATE = { x: 35.5 + tx, y: 8.8 + ty };
  if (CH.finale === 'boss') for (const [a, sh] of [[0.6, '#3f7fbf'], [2.4, '#e0a33a'], [4.2, '#5aa05a']]) {
    const vx = PYRE.x + Math.cos(a) * 2.2, vy = PYRE.y + Math.sin(a) * 1.8;

    lights.push({ kind: 'torch', x: vx, y: vy, r: 1.8, lift: 10, color: '255,150,60' });
  }
  let ferryExit = null;

    const { s, d, len } = L.jetty, p = [Math.abs(d[1]), Math.abs(d[0])];
    for (let i = 0; i < len; i++) for (const q of [0, 1]) set(s[0] + d[0] * i + p[0] * q, s[1] + d[1] * i + p[1] * q, JETTY);
    const e = [s[0] + d[0] * (len - 1), s[1] + d[1] * (len - 1)];
    ferryExit = { kind: 'ferry', x: e[0] + 0.5 + p[0] * 0.5, y: e[1] + 0.5 + p[1] * 0.5, tx: e[0], ty: e[1], dir: d, r: 1.7, need: 10, wait: 0, told: false,

  }

  const nearLane = (x0, y0, x1, y1, r) => { for (let y = y0 - r; y <= y1 + r; y++) for (let x = x0 - r; x <= x1 + r; x++) if (at(x, y) === LANE) return true; return false; };

  // in a real village, houses also stand on the paddy's edge along a lane, as they do in Goa

  CITY = !!(L.connect && VILLAGE.tile >= 18);

    if (CITY && real) {   // a town building: one to three storeys by its size; the big ones may have a flat terrace

      hs.town = true; hs.kandil = false;
      hs.floors = area >= 12 ? 3 : area >= 4 ? 2 : 1 + (rand() < 0.4 ? 1 : 0);
      hs.flat = area >= 16 && rand() < 0.6;
      hs.wall = TOWN_WALLS[Math.floor(rand() * TOWN_WALLS.length)];

        hs.floors = 2; hs.flat = false; hs.wall = ['#f2c230', '#e0763a', '#2f6fd0', '#d0344a', '#2fa08a', '#e8a33a', '#8a5ab8'][Math.floor(rand() * 7)];
      }

  }

    let best = null, bd = 9;
    for (let yy = Math.floor(sy0) - 3; yy <= Math.floor(sy0) + 3; yy++) for (let xx = Math.floor(sx0) - 3; xx <= Math.floor(sx0) + 3; xx++) {
      const d = hyp(xx - sx0, yy - sy0);
      if (d < bd && xx > 1 && yy > 1 && xx < W - 2 && yy < H - 2 && [GR, PAD, MUD].includes(at(xx, yy)) && D4.some(([dx, dy]) => [LANE, ROAD, GR, PAD].includes(at(xx + dx, yy + dy)))) { bd = d; best = [xx, yy]; }
    }

  }

  for (const pr of props) noCarve[pr.y * W + pr.x] = 1;

  for (const h of houses) {
    const dx = h.x + Math.floor(h.w / 2), dy = h.y + h.h;
    if (dy >= H - 1 || distT[dy * W + dx] >= 0 || solid(at(dx, dy))) continue;
    let best = null, bd = 1e9;
    for (let i = 0; i < W * H; i++) if (distT[i] >= 0 && (map[i] === LANE || map[i] === ROAD)) { const d = hyp(i % W - dx, ((i / W) | 0) - dy); if (d < bd) { bd = d; best = [i % W, (i / W) | 0]; } }
    if (best) { carvePath(best, [dx, dy], noCarve, noise); bfs(START.x, START.y, distT); }
  }

    if (map[y * W + x] !== ROAD) continue;

    const ns = [-2, -1].some(a => at(x, y + a) === WATER) && [1, 2].some(a => at(x, y + a) === WATER);

    bridges.push({ x, y, ns, big });
    if (big && (x + y) % 2 === 0) lights.push({ kind: 'led', x: x + 0.5, y: y + 0.5, r: 1.6, lift: 8, color: (x + y) % 4 ? '255,90,200' : '170,110,255' });
  }

    const nearW = (x, y, r) => { for (let yy = y - r; yy <= y + r; yy++) for (let xx = x - r; xx <= x + r; xx++) if (at(xx, yy) === WATER) return true; return false; };
    const placed = [];

    for (let yy = Math.floor(py) - 4; yy <= Math.floor(py) + 4; yy++) for (let xx = Math.floor(px) - 4; xx <= Math.floor(px) + 4; xx++) {
      const d = hyp(xx - px, yy - py);
      if (d < bd && xx > 1 && yy > 1 && xx < W - 2 && yy < H - 2 && [GR, PAD, MUD].includes(at(xx, yy)) && D4.some(([dx, dy]) => [ROAD, LANE].includes(at(xx + dx, yy + dy)))) { bd = d; best = [xx, yy]; }

function habitat(x, y) {

  if (water || at(x, y) === SAND) return 'jalpari';
  if (forest[y * W + x] || trees >= 6) return 'brahmarakshas';
  if (at(x, y) === PAD || at(x, y) === MUD) return 'chedvan';
  return 'devchar';

    else { x = 1 + Math.floor(rand() * (W - 2)); y = 1 + Math.floor(rand() * (H - 2)); }
    if (x < 1 || y < 1 || x > W - 2 || y > H - 2 || solid(map[y * W + x]) || (ok && !ok(x, y))) continue;
    const d = dist[y * W + x];
    if (d < 0 || (!near && d < 18) || inSafe(x + 0.5, y + 0.5) || holy().some(e => hyp(x - e.x, y - e.y) < 8)) continue;

function setupRescues() {

  const pool = ROLES.map(r => Object.assign({}, r, (ROLE_LINES[CH.id] || {})[r.id])).filter(r => r.dest === 'home' || exits.some(e => e.kind === r.dest));
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }

  const fakes = 1 + (rand() < 0.5 ? 1 : 0);

  for (const i of idx) if (roster[i]) roster[i].fake = true;

function destFor(role) {

  const homes = houses.map(h => [h, h.x + Math.floor(h.w / 2), h.y + h.h]).filter(([, tx, ty]) => !solid(at(tx, ty)) && dist[ty * W + tx] > 6);

function update(dt) {

  let sy = (keys.has('arrowdown') || keys.has('s') ? 1 : 0) - (keys.has('arrowup') || keys.has('w') ? 1 : 0);
  let mag = sx || sy ? 1 : 0;
  if (joy.id !== null && hyp(joy.dx, joy.dy) > 8) { sx = joy.dx; sy = joy.dy; mag = Math.min(1, hyp(joy.dx, joy.dy) / 45); }
  let [ix, iy] = screenToMap(sx, sy);
  const m = hyp(ix, iy);
  if (m > 0) { ix = ix / m * mag; iy = iy / m * mag; }
  player.moving = mag > 0.05;
  if (player.moving && sx) player.face = Math.sign(sx);
  if (player.moving) { const hm = hyp(ix, iy); player.hx = ix / hm; player.hy = iy / hm; }
  const pTile = at(Math.floor(player.x), Math.floor(player.y));
  // creeping (Shift, or a short drag) is slow but quiet enough to pass a sleeping dog
  const ride = player.bike, wet = flood[Math.floor(player.y) * W + Math.floor(player.x)];
  player.creep = !ride && (keys.has('shift') || (joy.id !== null && mag < 0.55));
  let sp = 4.3 * (pTile === PAD ? 0.6 : 1) * (player.creep ? 0.5 : 1) * (1 - 0.55 * wet);
  if (realOn()) sp *= 0.6;   // a child in a real-sized city walks it more slowly
  if (ride && ride.pushing) sp *= 0.55;   // pushing a dry bike: walking pace, and slower
  else if (ride) {
    const surf = [ROAD, LANE, PLAZA, COURT, JETTY].includes(pTile) ? 1 : pTile === PAD ? 0.3 : 0.55;
    const target = player.moving && ride.fuel > 0 ? 9 * surf * mag * (1 - 0.6 * wet) : 0;
    ride.v += (target - ride.v) * Math.min(1, dt * (target > ride.v ? 1.8 : 2.6));

  }
  if (S.burnT < 0 && S.fallT <= 0) moveEnt(player, ix * sp * dt, iy * sp * dt);
  if (ride) updateBike(dt);

  updateWalkers(dt);
  // traffic on the main road waits for a child standing in front of it
  for (const c of S.cars) {

    const busStop = exits.find(e => e.kind === 'bus');
    if ((c.type === 'ktc' || c.type === 'private') && busStop && hyp(c.x - busStop.x, c.y - busStop.y) < 1.6 && !(c.stopT < 0)) { c.stopT = (c.stopT || 3) - dt; if (c.stopT <= 0) c.stopT = -6; }

    if (c.type === 'private' && Math.random() < dt * 0.15 && hyp(c.x - player.x, c.y - player.y) < 10) SFX.play('horn', c.x, c.y, 18);
  }
  for (const b of S.boats) wander(b, WATER, 0.7, dt, 0.7);

  const pt = Math.floor(player.y) * W + Math.floor(player.x);

  }

  if (CH.life) updateLife(dt);
  const safe = inSafe(player.x, player.y);

  // the person you are walking home

  if (S.nextT > 0) { S.nextT -= dt; if (S.nextT <= 0) nextRescue(); }

  const npc = S.npc && S.npc.state === 'escort' && S.npc.flee >= 0 ? S.npc : null;
  for (const d of demons.slice()) {
    d.stun -= dt; d.lit -= dt; d.alert = (d.alert || 0) - dt;
    const tx = Math.floor(d.x), ty = Math.floor(d.y), dd = dist[ty * W + tx];
    const nd = npc ? distN[ty * W + tx] : -1;

    const field = goNpc ? distN : dist, tgt = goNpc ? npc : player, fd = goNpc ? nd : dd;
    const pd = hyp(d.x - tgt.x, d.y - tgt.y);

    else d.chasing = (d.alert > 0 && fd < 40) || (d.chasing ? fd < 18 : (pd < 6.5 && fd < 11));

    }

  S.beam = null;

function updateNpc(n, dt) {

  } else if (n.flee > 0) {

function updateBoss(b, dt) {

    hindu('Kartika', 1, 'padwa', 'Diwali Padwa', { fest: 'samai' });
    hindu('Kartika', 12, 'tulsi', 'Tulsi Vivah', { fest: 'samai' });
    hindu('Bhadrapada', 4, 'chovoth', 'Ganesh Chaturthi (Chovoth)', { fest: 'samai', crackers: true });

  if (m >= 10 || m <= 1) return x < 0.55 ? { kind: 'Clear', rain: 0, cloud: 0, mist: 0.2 } : x < 0.9 ? { kind: 'Morning mist', rain: 0, cloud: 0.1, mist: 0.9 } : { kind: 'Hazy', rain: 0, cloud: 0.4, mist: 0.4 };
  if (m === 4 && x < 0.25) return { kind: 'Pre-monsoon storm', rain: 0.7, cloud: 1, mist: 0.1, lightning: true };
  return x < 0.7 ? { kind: 'Hot and hazy', rain: 0, cloud: 0.3, mist: 0.1 } : { kind: 'Clear', rain: 0, cloud: 0, mist: 0 };

  S.mode = 'paused'; w.pause = 6; w.moving = false;
  const greet = ['Haan, tell me', 'Yes, baba?', 'Lost, are you?', 'Bolo, where to?'][Math.floor(Math.random() * 4)];
  const opts = [];
  const q = S.quest;
  if (q && q.kind === 'letters' && q.state === 'on') for (const it of q.items) if (!it.got) opts.push({ what: `the ${it.house.family} house`, x: it.x, y: it.y, house: it.house });
  if (q && !q.done && q.state !== 'on') opts.push({ what: q.giver.role.name, x: q.giver.x, y: q.giver.y });
  for (const pl of placesList()) if (!opts.some(o => o.what === pl.what) && pl.type !== 'litter') opts.push(pl);
  // any family in the village, by name
  const fams = [...new Set(houses.filter(h => h.family).map(h => h.family))].sort();
  card.innerHTML = `
    <span class="eyebrow">${esc(w.name)}${w.state === 'shop' ? ' · at the shop door' : ''}</span>
    <h1 style="font-size:32px">“${greet}”</h1>
    <p id="askAnswer">Where do you want to go?</p>
    <div class="taluka-list" id="askList">${opts.slice(0, 12).map((o, i) => `<div><button class="go" type="button" data-i="${i}">${esc(o.what[0].toUpperCase() + o.what.slice(1))}</button></div>`).join('')}
      <div><label class="check" style="flex:1">A family’s house <select id="askFam"><option value="">choose…</option>${fams.map(f => `<option>${esc(f)}</option>`).join('')}</select></label></div>
    </div>
    <div class="row"><button class="ghost" id="askBye" type="button">Thanks, bye</button></div>`;
  screen.hidden = false;
  const answer = o => {
    document.getElementById('askAnswer').textContent = `“${o.what[0].toUpperCase() + o.what.slice(1)}? ${directionsTo(o, w)}”`;
    document.getElementById('askList').innerHTML = `<div><button class="start" type="button" id="askGuide">Show me on the map</button></div>`;
    document.getElementById('askGuide').onclick = () => { S.guide = { x: o.x, y: o.y, tx: Math.floor(o.x), ty: Math.floor(o.y), what: o.what }; bye(); };
  };
  const bye = () => { S.mode = 'play'; screen.hidden = true; };
  for (const b of card.querySelectorAll('button[data-i]')) b.onclick = () => answer(opts[+b.dataset.i]);
  document.getElementById('askFam').onchange = e => {
    const h = houses.find(hh => hh.family === e.target.value);
    if (h) answer({ what: `the ${h.family} house`, x: h.x + Math.floor(h.w / 2) + 0.5, y: h.y + h.h + 0.5, house: h });
  };
  document.getElementById('askBye').onclick = bye;
  const first = card.querySelector('button[data-i]'); (first || document.getElementById('askBye')).focus();
}

    out.push({ x: e.x, y: e.y, tx: e.tx, ty: e.ty, what: nm.replace(/^the /, ''), type: e.kind });
  }
  for (const sg of sights) out.push({ x: sg.x + 0.5, y: sg.y + 0.5, tx: sg.x, ty: sg.y, what: sg.name, type: 'sight', visited: visitedSight(sg) });
  for (const pu of pumps) out.push({ x: pu.x + 0.5, y: pu.y + 1, tx: pu.x, ty: pu.y + 1, what: `${pu.name} petrol pump`, type: 'pump' });
  for (const h of houses) if (h.shop) { const dx = h.x + Math.floor(h.w / 2), dy = h.y + h.h; out.push({ x: dx + 0.5, y: dy + 0.5, tx: dx, ty: dy, what: h.shop.name.toLowerCase().replace(/^./, c => c.toUpperCase()), type: 'shop' }); }

  const left = (S.litter || []).filter(l => !l.got);
  if (left.length) { const l = left.sort((a, b) => hyp(a.x - player.x, a.y - player.y) - hyp(b.x - player.x, b.y - player.y))[0]; out.push({ x: l.x, y: l.y, tx: Math.floor(l.x), ty: Math.floor(l.y), what: `the nearest litter (${left.length} left)`, type: 'litter' }); }

const PLACE_ICON = { pump: '#f07a1a', shop: '#e0763a', temple: '#f0c86a', chapel: '#ffffff', bus: '#8fd0ff', ferry: '#8fd0ff', devli: '#9fe8d6', sight: '#ffe1a0', quest: '#f2b441', litter: '#e8e4dc' };
function showPlaces() {
  if (!S || !player) return;
  const paused = S.mode === 'play';
  if (paused) S.mode = 'paused';
  const list = placesList();
  card.innerHTML = `
    <span class="eyebrow">${esc(CH.place)} · ${talukaOf(CH.village).name ? talukaOf(CH.village).name + ' taluka' : 'Goa'}</span>
    <h1>Places</h1>
    <canvas id="bigMap" width="560" height="280" style="width:100%;border-radius:6px;background:#0a1020" aria-label="Map of the village with the places listed below"></canvas>
    <div class="taluka-list">${list.map((p, i) => `<div><b style="min-width:2rem;color:${PLACE_ICON[p.type]}">${i + 1}</b><span style="flex:1;min-width:0">${esc(p.what[0].toUpperCase() + p.what.slice(1))}${p.visited ? ' ✓' : ''} · ${p.d} m${fogAt(p.tx, p.ty) < 120 ? ' · unexplored' : ''}</span><button class="go" type="button" data-i="${i}">Guide me</button></div>`).join('')}</div>
    <div class="row">
      <button class="start" id="placesBack" type="button">Back to the village</button>
      ${S.guide ? '<button class="ghost" id="guideOff" type="button">Stop guiding</button>' : ''}
      <button class="ghost" id="placesGoa" type="button">Map of Goa</button>
    </div>`;
  screen.hidden = false;
  // the big map: the village, its fog, every listed place numbered, and you
  const c = document.getElementById('bigMap'), g = c.getContext('2d'), r2 = Math.min(2, devicePixelRatio || 1);
  c.width = Math.round(c.clientWidth * r2) || 560; c.height = Math.round(c.width * H / W);
  c.style.height = 'auto'; c.style.maxHeight = '62vh'; c.style.objectFit = 'contain';
  if (miniFogDirty) bakeMiniFog(true);
  if (miniBase.width !== W * MS) bakeMini();
  drawMapView(g, c.width, c.height, 0, 0, W, H, r2, true);
  const k = c.width / W, at2 = (x, y) => [x * k, y * k];
  g.font = `700 ${10 * r2}px Mukta, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  list.forEach((p, i) => {
    if (fogAt(p.tx, p.ty) < 120 && p.type !== 'quest') return;   // the unexplored keep their places to themselves
    const [x, y] = at2(p.x, p.y);
    g.beginPath(); g.arc(x, y, 6.5 * r2, 0, 7); g.fillStyle = PLACE_ICON[p.type]; g.fill(); g.strokeStyle = '#0a1020'; g.lineWidth = 1.5 * r2; g.stroke();
    g.fillStyle = '#0a1020'; g.fillText(String(i + 1), x, y + r2 * 0.5);
  });
  const back = () => { if (paused) { S.mode = 'play'; screen.hidden = true; } else showIntro(); };
  for (const b of card.querySelectorAll('button[data-i]')) b.onclick = () => {
    const p = list[+b.dataset.i];
    S.guide = { x: p.x, y: p.y, tx: p.tx, ty: p.ty, what: p.what };
    back(); whisper(`Follow the arrow to ${p.what}.`);
  };
  document.getElementById('placesBack').onclick = back;
  const off = document.getElementById('guideOff'); if (off) off.onclick = () => { S.guide = null; back(); };
  document.getElementById('placesGoa').onclick = () => { if (paused) S.mode = 'play'; showGoaMap(); };
  document.getElementById('placesBack').focus();
}

/* ---------- Goa by taluka: where each mapped village is, and travel between them ---------- */
// Taluka centres are approximate, for placing labels on the sketch map only.
const TALUKAS = [
  { id: 'pernem', name: 'Pernem', c: [15.72, 73.80] }, { id: 'bardez', name: 'Bardez', c: [15.575, 73.80] },
  { id: 'bicholim', name: 'Bicholim', c: [15.60, 73.96] }, { id: 'sattari', name: 'Sattari', c: [15.56, 74.13] },
  { id: 'tiswadi', name: 'Tiswadi', c: [15.47, 73.86] }, { id: 'ponda', name: 'Ponda', c: [15.40, 74.01] },
  { id: 'mormugao', name: 'Mormugao', c: [15.38, 73.85] }, { id: 'dharbandora', name: 'Dharbandora', c: [15.36, 74.18] },
  { id: 'salcete', name: 'Salcete', c: [15.25, 73.97] }, { id: 'sanguem', name: 'Sanguem', c: [15.20, 74.17] },
  { id: 'quepem', name: 'Quepem', c: [15.14, 74.05] }, { id: 'canacona', name: 'Canacona', c: [15.00, 74.06] }
];
const VILLAGE_TALUKA = { siolim: 'bardez', calangute: 'bardez', panjim: 'tiswadi', divar: 'tiswadi', chorao: 'tiswadi', tonca: 'ponda' };
const talukaOf = v => TALUKAS.find(t => t.id === VILLAGE_TALUKA[v]) || { name: '' };
// a rough outline of Goa, enough to tell north from south and the coast from the ghats
const GOA_OUTLINE = [[15.80, 73.69], [15.72, 73.69], [15.62, 73.72], [15.55, 73.75], [15.50, 73.80], [15.46, 73.78], [15.41, 73.79], [15.37, 73.84], [15.32, 73.90],
  [15.20, 73.93], [15.08, 73.97], [14.95, 74.03], [14.89, 74.10], [14.95, 74.20], [15.08, 74.27], [15.25, 74.32], [15.42, 74.28], [15.58, 74.27], [15.68, 74.18],
  [15.75, 74.05], [15.80, 73.90]];
// where each village's name sits beside its dot, so the close ones around the Mandovi don't overlap
const GOA_LABEL = { chorao: [-9, -6, 'end'], divar: [2, -10, 'middle'], tonca: [9, 12, 'start'] };
const goaXY = (lat, lon) => [+((lon - 73.64) * 620).toFixed(1), +((15.83 - lat) * 620).toFixed(1)];
function showGoaMap() {
  const paused = !!S && S.mode === 'play';
  if (paused) S.mode = 'paused';
  const here = S && CH.life ? CH.village : null;
  const vils = Object.keys(VILLAGE_TALUKA);
  const svg = `<svg viewBox="0 0 420 570" role="img" aria-label="Sketch map of Goa with its talukas and the villages you can visit">
    <polygon points="${GOA_OUTLINE.map(([a, b]) => goaXY(a, b).join(',')).join(' ')}" fill="rgba(68,115,58,.22)" stroke="rgba(236,228,207,.35)" stroke-width="1.5"/>
    ${TALUKAS.map(t => { const [x, y] = goaXY(...t.c), has = vils.some(v => VILLAGE_TALUKA[v] === t.id); return `<text x="${x}" y="${y}" text-anchor="middle" opacity="${has ? 1 : 0.55}">${t.name}</text>`; }).join('')}
    ${vils.map(v => { const [x, y] = goaXY(...VILLAGES[v].centre), me = v === here, lb = GOA_LABEL[v] || [9, 4, 'start'];
      return `<g class="vil" data-v="${v}" tabindex="0" role="button" aria-label="${me ? 'You are in' : 'Go to'} ${VILLAGE_TITLES[v]}"><circle cx="${x}" cy="${y}" r="${me ? 7 : 5.5}" fill="${me ? '#f2b441' : '#9fe8d6'}" stroke="#070a16" stroke-width="2"/><text x="${x + lb[0]}" y="${y + lb[1]}" text-anchor="${lb[2]}">${VILLAGE_TITLES[v].replace(/ island$/, '')}</text></g>`; }).join('')}
  </svg>`;
  const list = TALUKAS.map(t => {
    const vs = vils.filter(v => VILLAGE_TALUKA[v] === t.id);
    return `<div><b>${t.name}</b>${vs.length ? vs.map(v => `<button class="go" type="button" data-v="${v}" ${v === here ? 'disabled' : ''}>${v === here ? 'You are in ' : ''}${VILLAGE_TITLES[v]} · ${fogPct(v)}%</button>`).join('') : '<span class="none">not mapped yet</span>'}</div>`;
  }).join('');
  card.innerHTML = `
    <span class="eyebrow">Goa · twelve talukas</span>
    <h1>Where to?</h1>
    <p>${here ? `You are in ${VILLAGE_TITLES[here]}, ${talukaOf(here).name} taluka. Take the bus or the ferry to another village: the clock, your points and your streak come with you.` : 'Pick a village to live in on Goa time. You can travel to another one whenever you like.'}</p>
    <div class="goa">${svg}<div class="taluka-list">${list}</div></div>
    <p style="font-size:12px;color:var(--muted)">The percentage is how much of each village you have explored on this device. A rough sketch, not to scale. Villages sit at their real coordinates; taluka names mark roughly where each one lies.</p>
    <div class="row"><button class="${paused ? 'start' : 'ghost'}" id="goaBack" type="button">${paused ? 'Back to the village' : 'Back'}</button></div>`;
  screen.hidden = false;
  const go = v => { if (v && v !== here) travelTo(v); };
  for (const b of card.querySelectorAll('[data-v]')) {
    b.onclick = () => go(b.dataset.v);
    b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); go(b.dataset.v); } };
  }
  document.getElementById('goaBack').onclick = () => { if (paused) { S.mode = 'play'; screen.hidden = true; } else showIntro(); };
  document.getElementById('goaBack').focus();
}
function travelTo(v) {
  const from = S && CH.life ? CH.village : null;
  const keep = from ? { dayMin: S.dayMin, dayIdx: S.dayIdx, points: S.points } : null;
  CH = lifeChapter(v);
  const m = MODE; MODE = 'real'; start(); MODE = m;
  if (!keep) return;
  Object.assign(S, keep); newLifeDay();
  if (!isNight()) demons.length = 0;
  const how = [from, v].some(x => x === 'divar' || x === 'chorao') ? 'ferry' : 'bus';
  const cross = VILLAGE_TALUKA[from] !== VILLAGE_TALUKA[v];
  whisper(`You take the ${how} from ${VILLAGE_TITLES[from]} to ${VILLAGE_TITLES[v]}${cross ? `, into ${talukaOf(v).name} taluka` : ''}. ${clockText()}.`);
}

/* ---------- loop ---------- */
let last = performance.now(), miniT = 0, fogSaveT = 3;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render(); if (turnAnim) compositeTurn(dt); SFX.tick(dt);
  if ((miniT -= dt) <= 0) { miniT = 0.12; drawMini(); }
  if ((fogSaveT -= dt) <= 0) { fogSaveT = 3; saveFog(); }
  requestAnimationFrame(frame);
}
resize();
newGame();
showIntro();
requestAnimationFrame(frame);
</script>
